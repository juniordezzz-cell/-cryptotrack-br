<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade — Portfólio MundoDeFi</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/mundodefi-tokens.css">
<link rel="stylesheet" href="/portfolio/portfolio.css">
</head>
<body>
<div class="app" id="app"></div>
<script src="/portfolio/portfolio.js"></script>
<script>
(function(){
'use strict';
var e=P.esc;

function formOp(){
  P.modal('Nova operação',
   '<div class="frow3"><div class="fg"><label>Ativo</label><input id="fAt" placeholder="Ex: BTC" style="text-transform:uppercase"></div>'
   +'<div class="fg"><label>Direção</label><select id="fDir"><option value="L">Long</option><option value="S">Short</option></select></div>'
   +'<div class="fg"><label>Alavancagem</label><input id="fAl" type="number" step="1" value="1"></div></div>'
   +'<div class="frow"><div class="fg"><label>Resultado (US$, use − para perda)</label><input id="fRes" type="number" step="any" placeholder="Ex: 120 ou -45"></div>'
   +'<div class="fg"><label>Data</label><input id="fDt" type="date" value="'+P.today()+'"></div></div>'
   +'<div class="fg"><label>Anotação (setup, motivo, lição)</label><textarea id="fTxt" placeholder="O que você viu nessa operação?"></textarea></div>',
   {footer:'<button class="btn btn-p" id="okOp">Salvar</button>'});
  document.getElementById('okOp').onclick=function(){
    var at=P.val('fAt').toUpperCase();if(!at)return;
    var res=P.num('fRes');
    P.st.trade.ops.push({id:P.uid(),dt:P.val('fDt')||P.today(),ativo:at,dir:P.val('fDir')||'L',alav:P.num('fAl')||1,res:res,txt:P.val('fTxt')});
    P.st.trade.banca.atu=(Number(P.st.trade.banca.atu)||0)+res;
    P.save();P.closeModal();render();
  };
}
function formBanca(){
  var b=P.st.trade.banca;
  P.modal('Configurar banca',
   '<div class="frow"><div class="fg"><label>Banca inicial (US$)</label><input id="fIni" type="number" step="any" value="'+(b.ini||0)+'"></div>'
   +'<div class="fg"><label>Banca atual (US$)</label><input id="fAtu" type="number" step="any" value="'+(b.atu||0)+'"></div></div>'
   +'<div class="fhint">A banca atual também é ajustada automaticamente a cada operação registrada.</div>',
   {footer:'<button class="btn btn-p" id="okB">Salvar</button>'});
  document.getElementById('okB').onclick=function(){
    b.ini=P.num('fIni');b.atu=P.num('fAtu');P.save();P.closeModal();render();
  };
}

function render(){
  document.getElementById('pgTitle').textContent='Trade';
  document.getElementById('pgSub').textContent='Suas operações, gestão de banca e métricas de desempenho';
  document.getElementById('btnAdd').onclick=formOp;

  var b=P.st.trade.banca,s=P.tradeStats();
  var ev=b.ini>0?(b.atu-b.ini)/b.ini*100:0;

  var html='<div class="atlas-card"><div class="ico">📓</div><div><b>Diário Inteligente</b><p>O Atlas lê suas anotações e resultados e devolve padrões, erros recorrentes e acertos. Exclusivo Premium.</p></div><div class="right">'+P.lockBtn('Diário Inteligente','premium')+'</div></div>';

  html+='<div class="mgrid">'
   +'<div class="mc"><div class="mc-accent" style="background:var(--purple,#9945FF)"></div><div class="mc-lbl">Banca atual</div><div class="mc-val">'+P.money(b.atu)+'</div><div class="mc-sub">inicial: '+P.money(b.ini)+' <span class="'+P.cls(ev)+'">('+P.pct(ev)+')</span></div></div>'
   +'<div class="mc"><div class="mc-accent" style="background:var(--green,#14F195)"></div><div class="mc-lbl">Resultado total</div><div class="mc-val '+P.cls(s.res)+'">'+P.money(s.res)+'</div></div>'
   +'<div class="mc"><div class="mc-accent" style="background:var(--cyan,#00E5FF)"></div><div class="mc-lbl">Win rate</div><div class="mc-val">'+s.win.toFixed(0)+'%</div><div class="mc-sub">'+s.n+' operações</div></div>'
   +'<div class="mc"><div class="mc-accent" style="background:var(--gold,#F5B614)"></div><div class="mc-lbl">Gestão</div><div class="mc-val" style="font-size:1rem;padding-top:6px"><button class="btn btn-g btn-sm" id="btnBanca">Configurar banca</button></div></div>'
   +'</div>';

  var ops=P.st.trade.ops.slice().sort(function(a,c){return String(c.dt||'').localeCompare(String(a.dt||''));});
  var lim=P.isFree()?8:1000;
  var rows=ops.slice(0,lim).map(function(o){
    return '<tr><td class="mono" style="color:var(--mut)">'+P.dBR(o.dt)+'</td><td><b>'+e(o.ativo)+'</b></td>'
     +'<td><span class="badge '+(o.dir==='L'?'b-open':'b-closed')+'">'+(o.dir==='L'?'Long':'Short')+'</span></td>'
     +'<td class="num mono">'+(o.alav||1)+'x</td>'
     +'<td class="num"><span class="res-pill '+(o.res>=0?'res-up':'res-dn')+'">'+P.money(o.res)+'</span></td>'
     +'<td style="color:var(--mut);font-size:12px;max-width:280px">'+e(o.txt||'—')+'</td></tr>';
  }).join('');
  if(P.isFree()&&ops.length>lim)rows+='<tr class="lockrow"><td colspan="6">🔒 Ver histórico completo de operações — PRO</td></tr>';
  html+='<div class="card"><div class="card-hd"><div class="card-title">Operações</div></div><div class="tblw"><table style="min-width:720px"><thead><tr><th>Data</th><th>Ativo</th><th>Direção</th><th class="num">Alav.</th><th class="num">Resultado</th><th>Anotação</th></tr></thead><tbody>'
   +(rows||'<tr><td colspan="6"><div class="empty">Nenhuma operação — registre a primeira em <b>+ Adicionar</b>.</div></td></tr>')+'</tbody></table></div></div>';

  document.getElementById('pg').innerHTML=html;
  document.getElementById('btnBanca').onclick=formBanca;
}
P.init('trade',render);
})();
</script>
</body>
</html>
