<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOLD — Portfólio MundoDeFi</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/mundodefi-tokens.css">
<link rel="stylesheet" href="/portfolio/portfolio.css">
</head>
<body>
<div class="app" id="app"></div>
<script src="/portfolio/portfolio.js"></script>
<script>
(function(){
'use strict';
var e=P.esc;

function formTx(pre){
  pre=pre||{};
  var ops=P.st.hold.map(function(a){return '<option value="'+a.id+'"'+(pre.aid===a.id?' selected':'')+'>'+e(a.tk)+'</option>';}).join('');
  var carts=P.st.carteiras.map(function(c){return '<option value="'+c.id+'">'+e(c.nome)+'</option>';}).join('');
  P.modal('Nova transação de HOLD',
   '<div class="fg"><label>Ativo</label><select id="fAid"><option value="__novo">＋ Novo ativo…</option>'+ops+'</select></div>'
   +'<div id="novoWrap"><div class="frow"><div class="fg"><label>Ticker</label><input id="fTk" placeholder="Ex: BTC" style="text-transform:uppercase"></div>'
   +'<div class="fg"><label>ID CoinGecko (p/ preço automático)</label><input id="fCg" placeholder="ex: bitcoin (opcional)"></div></div>'
   +'<div class="fg"><label>Carteira</label><select id="fCart">'+carts+'</select></div></div>'
   +'<div class="frow3"><div class="fg"><label>Tipo</label><select id="fT"><option value="c">Compra</option><option value="v">Venda</option></select></div>'
   +'<div class="fg"><label>Quantidade</label><input id="fQ" type="number" step="any" placeholder="0,00"></div>'
   +'<div class="fg"><label>Preço unitário (US$)</label><input id="fPr" type="number" step="any" placeholder="0,00"></div></div>'
   +'<div class="fg"><label>Data</label><input id="fDt" type="date" value="'+P.today()+'"></div>',
   {footer:'<button class="btn btn-p" id="okTx">Salvar</button>'});
  var sel=document.getElementById('fAid');
  if(pre.aid)sel.value=pre.aid;
  function tog(){document.getElementById('novoWrap').style.display=sel.value==='__novo'?'block':'none';}
  sel.onchange=tog;tog();
  document.getElementById('okTx').onclick=function(){
    var aid=sel.value,q=P.num('fQ'),pr=P.num('fPr'),dt=P.val('fDt')||P.today(),t=P.val('fT')||'c';
    if(!q)return;
    var a;
    if(aid==='__novo'){
      var tk=P.val('fTk').toUpperCase();if(!tk)return;
      a={id:P.uid(),tk:tk,cg:P.val('fCg').toLowerCase(),cart:P.val('fCart')||P.st.carteiras[0].id,last:pr,txs:[]};
      P.st.hold.push(a);
    }else{a=P.st.hold.filter(function(x){return x.id===aid;})[0];if(!a)return;}
    a.txs.push({t:t,q:q,pr:pr,dt:dt});
    P.save();P.closeModal();render();P.loadPrices().then(render);
  };
}

function render(){
  document.getElementById('pgTitle').textContent='HOLD';
  document.getElementById('pgSub').textContent='Seu patrimônio de longo prazo — quantidade de tokens, preço médio e lucro';
  document.getElementById('btnAdd').onclick=function(){formTx();};

  var val=0,cost=0;
  var rows=P.st.hold.filter(P.filtCart).map(function(a){
    var x=P.holdPos(a);if(x.qty<=0)return'';
    val+=x.val;cost+=x.cost;
    var pc=x.cost>0?x.lucro/x.cost*100:0;
    var cn=(P.st.carteiras.filter(function(c){return c.id===a.cart;})[0]||{}).nome||'—';
    return '<tr><td><div class="tk"><div class="tk-ic">'+e(a.tk)+'</div><div><b>'+e(a.tk)+'</b><small>'+e(cn)+'</small></div></div></td>'
     +'<td class="num mono">'+x.qty.toLocaleString('pt-BR',{maximumFractionDigits:6})+'</td>'
     +'<td class="num mono">'+P.money(x.avg,2)+'</td><td class="num mono">'+P.money(a.last||0,2)+'</td>'
     +'<td class="num mono">'+P.money(x.val)+'</td>'
     +'<td class="num mono '+P.cls(x.lucro)+'">'+P.money(x.lucro)+' <small style="color:var(--mut2)">('+P.pct(pc)+')</small></td>'
     +'<td class="num"><button class="btn btn-g btn-sm" data-tx="'+a.id+'">+ Transação</button></td></tr>';
  }).join('');
  var lucro=val-cost,rent=cost>0?lucro/cost*100:0;

  var html='<div class="mgrid">'
   +'<div class="mc"><div class="mc-accent" style="background:var(--gold,#F5B614)"></div><div class="mc-lbl">Valor em HOLD</div><div class="mc-val">'+P.money(val)+'</div></div>'
   +'<div class="mc"><div class="mc-accent" style="background:var(--purple,#9945FF)"></div><div class="mc-lbl">Investido</div><div class="mc-val">'+P.money(cost)+'</div></div>'
   +'<div class="mc"><div class="mc-accent" style="background:var(--green,#14F195)"></div><div class="mc-lbl">Lucro</div><div class="mc-val '+P.cls(lucro)+'">'+P.money(lucro)+'</div></div>'
   +'<div class="mc"><div class="mc-accent" style="background:var(--cyan,#00E5FF)"></div><div class="mc-lbl">Rentabilidade</div><div class="mc-val '+P.cls(rent)+'">'+P.pct(rent)+'</div></div>'
   +'</div>';

  html+='<div class="card"><div class="card-hd"><div class="card-title">Ativos</div></div><div class="tblw"><table style="min-width:720px"><thead><tr><th>Ativo</th><th class="num">Qtd</th><th class="num">Preço médio</th><th class="num">Preço atual</th><th class="num">Valor</th><th class="num">Lucro</th><th></th></tr></thead><tbody>'
   +(rows||'<tr><td colspan="7"><div class="empty">Nenhum ativo ainda — clique em <b>+ Adicionar</b> para registrar sua primeira compra.</div></td></tr>')+'</tbody></table></div></div>';

  var txs=[];
  P.st.hold.filter(P.filtCart).forEach(function(a){a.txs.forEach(function(t){txs.push({a:a,t:t});});});
  txs.sort(function(x,y){return String(y.t.dt||'').localeCompare(String(x.t.dt||''));});
  var lim=P.isFree()?8:1000;
  var hrows=txs.slice(0,lim).map(function(x){
    return '<tr><td class="mono" style="color:var(--mut)">'+P.dBR(x.t.dt)+'</td>'
     +'<td><b>'+e(x.a.tk)+'</b></td>'
     +'<td><span class="badge '+(x.t.t==='c'?'b-open':'b-closed')+'">'+(x.t.t==='c'?'Compra':'Venda')+'</span></td>'
     +'<td class="num mono">'+x.t.q+'</td><td class="num mono">'+P.money(x.t.pr,2)+'</td>'
     +'<td class="num mono">'+P.money(x.t.q*x.t.pr)+'</td></tr>';
  }).join('');
  if(P.isFree()&&txs.length>lim)hrows+='<tr class="lockrow"><td colspan="6">🔒 Ver histórico completo de transações — PRO</td></tr>';
  html+='<div class="card"><div class="card-hd"><div class="card-title">Histórico de transações</div></div><div class="tblw"><table style="min-width:620px"><thead><tr><th>Data</th><th>Ativo</th><th>Tipo</th><th class="num">Qtd</th><th class="num">Preço</th><th class="num">Total</th></tr></thead><tbody>'
   +(hrows||'<tr><td colspan="6"><div class="empty">Sem transações</div></td></tr>')+'</tbody></table></div></div>';

  document.getElementById('pg').innerHTML=html;
  document.querySelectorAll('[data-tx]').forEach(function(b){b.onclick=function(){formTx({aid:b.dataset.tx});};});
}
P.init('hold',render);
})();
</script>
</body>
</html>
