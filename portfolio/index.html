<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfólio MundoDeFi</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/mundodefi-tokens.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ═══════════ MUNDODEFI — PORTFÓLIO 2026 ═══════════
   Cores da marca herdam de /mundodefi-tokens.css (fallbacks locais). */
:root{
  --font:'Space Grotesk',system-ui,sans-serif;
  --mono:'Space Mono',ui-monospace,monospace;
  --r:8px;--rl:14px;--rxl:20px;--sidebar:236px;
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);
  --panel:rgba(255,255,255,.028);--panel2:rgba(255,255,255,.055);
  --txt:#EDF0F7;--mut:#8B93A7;--mut2:#5C6478;
  --purple-soft:rgba(153,69,255,.13);--green-soft:rgba(20,241,149,.11);
  --cyan-soft:rgba(0,229,255,.10);--gold-soft:rgba(245,182,20,.12);--red-soft:rgba(255,77,106,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg,#070A12);color:var(--txt);font-family:var(--font);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:var(--font);cursor:pointer}
.mono{font-family:var(--mono)}
.up{color:var(--green,#14F195)}.down{color:var(--red,#FF4D6A)}
:focus-visible{outline:2px solid var(--cyan,#00E5FF);outline-offset:2px;border-radius:4px}
::selection{background:var(--purple,#9945FF);color:#fff}

/* ═══ LAYOUT ═══ */
.app{display:flex;min-height:100vh}
.sb{width:var(--sidebar);flex-shrink:0;border-right:1px solid var(--line);background:rgba(255,255,255,.014);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:1.1rem .9rem}
.sb-logo{display:flex;align-items:center;gap:9px;padding:.3rem .5rem 1.1rem}
.sb-logo-mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--gold,#F5B614),#c98f06);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;color:#12100a}
.sb-logo-text{font-size:17px;font-weight:700;letter-spacing:-.03em;background:linear-gradient(120deg,var(--purple,#9945FF),var(--cyan,#00E5FF));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sb-sec{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut2);padding:.9rem .6rem .45rem}
.sb-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600;color:var(--mut);transition:all .13s;margin-bottom:2px}
.sb-item:hover{color:var(--txt);background:var(--panel2)}
.sb-item.active{color:var(--txt);background:linear-gradient(90deg,var(--purple-soft),transparent);border-left:2px solid var(--purple,#9945FF)}
.sb-item .ico{width:20px;text-align:center;font-size:15px}
.sb-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:1rem;border-top:1px solid var(--line)}
.sb-plan{background:var(--panel);border:1px solid var(--line);border-radius:var(--rl);padding:.7rem .8rem}
.sb-plan-lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut2);margin-bottom:6px}
.sb-plan select{width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;color:var(--txt);font-family:var(--font);font-size:12.5px;font-weight:600;padding:6px 8px}
.sb-atlas{display:flex;align-items:center;gap:9px;padding:.65rem .8rem;border-radius:var(--rl);background:linear-gradient(120deg,rgba(245,182,20,.10),rgba(153,69,255,.08));border:1px solid rgba(245,182,20,.25);font-size:12px;color:var(--mut)}
.sb-atlas b{color:var(--gold,#F5B614);font-size:12.5px}
.sb-link{font-size:11.5px;color:var(--mut2);padding:2px 6px}
.sb-link:hover{color:var(--cyan,#00E5FF)}
.main{min-width:0;width:100%;max-width:1320px;margin:0 auto;padding:1.6rem 2.2rem 3rem}

/* topbar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:1.5rem}
.top h1{font-size:1.45rem;font-weight:700;letter-spacing:-.025em}
.top-sub{font-size:12.5px;color:var(--mut2);width:100%;margin-top:-6px}
.top-right{margin-left:auto;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:3px}
.seg button{border:none;background:transparent;color:var(--mut);font-size:12px;font-weight:700;padding:6px 14px;border-radius:99px}
.seg button.on{background:var(--panel2);color:var(--txt)}
.fsel{background:var(--panel);border:1px solid var(--line2);border-radius:10px;color:var(--txt);font-family:var(--font);font-size:12.5px;font-weight:600;padding:8px 10px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:10px;font-weight:700;font-size:13px;border:1px solid transparent;transition:all .14s;padding:9px 16px}
.btn-p{background:var(--purple,#9945FF);color:#fff}
.btn-p:hover{filter:brightness(1.12)}
.btn-g{background:transparent;border-color:var(--line2);color:var(--txt)}
.btn-g:hover{border-color:var(--cyan,#00E5FF);color:var(--cyan,#00E5FF)}
.btn-green{background:transparent;border-color:rgba(20,241,149,.4);color:var(--green,#14F195)}
.btn-green:hover{background:var(--green-soft)}
.btn-red{background:transparent;border-color:rgba(255,77,106,.4);color:var(--red,#FF4D6A)}
.btn-red:hover{background:var(--red-soft)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}

/* metric cards */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:1.4rem}
.mc{background:var(--panel);border:1px solid var(--line);border-radius:var(--rl);padding:1.05rem 1.15rem;position:relative;overflow:hidden}
.mc-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut2);margin-bottom:.5rem;display:flex;align-items:center;gap:6px}
.mc-val{font-family:var(--mono);font-size:1.35rem;font-weight:700;letter-spacing:-.02em}
.mc-sub{font-family:var(--mono);font-size:11.5px;margin-top:3px;color:var(--mut)}
.mc-accent{position:absolute;top:0;left:0;right:0;height:2px}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--rl);margin-bottom:1.3rem;overflow:hidden}
.card-hd{display:flex;align-items:center;gap:10px;padding:.95rem 1.15rem;border-bottom:1px solid var(--line)}
.card-title{font-weight:700;font-size:14.5px}
.card-hd .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.card-bd{padding:1.15rem}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:13px;align-items:start}
.grid2b{display:grid;grid-template-columns:1fr 1fr;gap:13px;align-items:start}

/* tables */
.tblw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut2);text-align:left;padding:.65rem 1.1rem;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
td{padding:.7rem 1.1rem;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--panel2)}
th.num,td.num{text-align:right}
td.mono,.num{font-family:var(--mono)}
.tk{display:flex;align-items:center;gap:9px}
.tk-ic{width:28px;height:28px;border-radius:50%;background:var(--panel2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9.5px;font-weight:700;color:var(--mut);flex-shrink:0}
.tk b{font-size:13px}
.tk small{display:block;font-size:11px;color:var(--mut2);font-weight:400}

/* badges & tags */
.badge{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:4px;white-space:nowrap}
.b-pro{background:var(--purple-soft);color:var(--purple,#9945FF)}
.b-prem{background:var(--gold-soft);color:var(--gold,#F5B614)}
.b-open{background:var(--green-soft);color:var(--green,#14F195)}
.b-closed{background:var(--panel2);color:var(--mut)}
.tag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}

/* pools */
.pool-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.pool-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--rl);padding:1.1rem;cursor:pointer;transition:border-color .14s,transform .14s;display:flex;flex-direction:column;gap:.6rem}
.pool-card:hover{border-color:rgba(153,69,255,.45);transform:translateY(-2px)}
.pool-hd{display:flex;align-items:center;gap:10px}
.pool-par{font-family:var(--mono);font-weight:700;font-size:15px}
.pool-proto{font-size:11.5px;color:var(--mut)}
.pool-nums{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:12px}
.pool-nums div{display:flex;flex-direction:column;gap:1px}
.pool-nums span{font-size:9.5px;color:var(--mut2);text-transform:uppercase;letter-spacing:.06em;font-family:var(--mono)}
.pool-nums b{font-size:12.5px}
.strat-res{background:linear-gradient(120deg,var(--cyan-soft),transparent);border:1px solid rgba(0,229,255,.22);border-radius:var(--rl);padding:.9rem 1.1rem;display:flex;align-items:center;gap:12px;margin-bottom:.9rem;flex-wrap:wrap}
.strat-res b{font-family:var(--mono)}

/* tabs */
.tabs{display:flex;gap:6px;margin-bottom:1.1rem;flex-wrap:wrap}
.tab{font-size:13px;font-weight:700;padding:8px 18px;border-radius:99px;border:1px solid var(--line2);background:transparent;color:var(--mut)}
.tab.on{background:var(--cyan-soft);border-color:rgba(0,229,255,.4);color:var(--cyan,#00E5FF)}

/* forms */
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.fg label{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut2)}
.fin,.fg input,.fg select,.fg textarea{width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;color:var(--txt);font-family:var(--font);font-size:13.5px;padding:9px 11px;outline:none}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--purple,#9945FF)}
.fg textarea{resize:vertical;min-height:56px}
.fhint{font-size:11px;color:var(--mut2)}

/* modal */
.mdl-bg{position:fixed;inset:0;background:rgba(4,6,12,.72);backdrop-filter:blur(4px);z-index:900;display:none;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow-y:auto}
.mdl-bg.on{display:flex}
.mdl{background:#0C101C;border:1px solid var(--line2);border-radius:var(--rxl);width:100%;max-width:560px;box-shadow:0 30px 80px rgba(0,0,0,.6);margin-bottom:4vh}
.mdl.wide{max-width:760px}
.mdl-hd{display:flex;align-items:center;gap:10px;padding:1.05rem 1.3rem;border-bottom:1px solid var(--line)}
.mdl-title{font-weight:700;font-size:15.5px}
.mdl-x{margin-left:auto;background:transparent;border:none;color:var(--mut);font-size:19px;line-height:1;padding:4px}
.mdl-x:hover{color:var(--txt)}
.mdl-bd{padding:1.2rem 1.3rem}
.mdl-ft{padding:1rem 1.3rem;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}

/* diario */
.diario{display:flex;flex-direction:column;gap:8px}
.d-item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.7rem .9rem}
.d-item b{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--cyan,#00E5FF);display:block;margin-bottom:3px}
.d-item p{font-size:13px;color:var(--txt);line-height:1.55}
.tl{display:flex;flex-direction:column;gap:0;margin-top:.4rem}
.tl-item{display:flex;gap:12px;padding:.5rem 0;border-bottom:1px dashed var(--line)}
.tl-item:last-child{border-bottom:none}
.tl-date{font-family:var(--mono);font-size:10.5px;color:var(--mut2);white-space:nowrap;padding-top:2px}
.tl-txt{font-size:12.5px;line-height:1.5}
.tl-txt b{font-size:12.5px}

/* lock (gating de plano) */
.lockw{position:relative}
.lockw.locked>*:not(.lock-ov){filter:blur(5px);pointer-events:none;user-select:none}
.lock-ov{display:none;position:absolute;inset:0;z-index:5;align-items:center;justify-content:center;flex-direction:column;gap:10px;text-align:center;padding:1rem}
.lockw.locked .lock-ov{display:flex}
.lock-ov b{font-size:14px}
.lock-ov p{font-size:12px;color:var(--mut);max-width:280px}

.empty{padding:1.6rem;text-align:center;color:var(--mut2);font-size:13px}
.muted{color:var(--mut2)}
.chart-box{position:relative;height:260px}
.chart-box.sm{height:220px}

/* mobile */
.mob-top{display:none}
@media(max-width:960px){
  .app{flex-direction:column}
  .sb{position:fixed;left:0;top:0;bottom:0;z-index:800;transform:translateX(-105%);transition:transform .2s;background:#0A0E18;height:100vh}
  body.snav .sb{transform:none}
  .mob-top{display:flex;align-items:center;gap:10px;padding:.8rem 1rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(7,10,18,.9);backdrop-filter:blur(10px);z-index:700}
  .mob-burger{width:38px;height:38px;border-radius:9px;border:1px solid var(--line2);background:transparent;color:var(--txt);font-size:16px}
  .main{padding:1.1rem 1rem 3rem}
  .mgrid{grid-template-columns:1fr 1fr}
  .grid2,.grid2b{grid-template-columns:1fr}
  .pool-grid{grid-template-columns:1fr}
  .frow3{grid-template-columns:1fr}
}
@media(max-width:520px){.mgrid{grid-template-columns:1fr}.frow{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ═══ ADIÇÕES v1 ═══ */
.lockbtn{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:99px;border:1px dashed rgba(245,182,20,.45);background:var(--gold-soft);color:var(--gold,#F5B614);font-size:12px;font-weight:700;transition:all .14s}
.lockbtn:hover{border-style:solid;filter:brightness(1.1)}
.lockbtn.lp{border-color:rgba(153,69,255,.5);background:var(--purple-soft);color:var(--purple,#9945FF)}
.up-hero{text-align:center;padding:.6rem 0 .2rem}
.up-hero .big{font-size:44px;line-height:1;margin-bottom:.8rem}
.up-hero h3{font-size:1.25rem;font-weight:700;letter-spacing:-.02em;margin-bottom:.5rem}
.up-hero p{font-size:13.5px;color:var(--mut);line-height:1.65;max-width:400px;margin:0 auto}
.up-list{display:flex;flex-direction:column;gap:8px;margin:1.2rem 0 .4rem}
.up-item{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.65rem .9rem;font-size:13px;font-weight:600}
.up-item span{color:var(--gold,#F5B614)}
.wchip{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:99px;border:1px solid var(--line2);background:var(--panel);font-size:12px;font-weight:700;color:var(--mut)}
.wchip b{color:var(--txt)}
.lockrow td{text-align:center;padding:.8rem;color:var(--gold,#F5B614);font-size:12px;font-weight:700;cursor:pointer;background:var(--gold-soft)}
.lockrow:hover td{filter:brightness(1.15)}
.atlas-card{background:linear-gradient(130deg,rgba(245,182,20,.10),rgba(153,69,255,.08));border:1px solid rgba(245,182,20,.3);border-radius:var(--rl);padding:1.15rem;display:flex;align-items:center;gap:14px;margin-bottom:1.3rem;flex-wrap:wrap}
.atlas-card .ico{width:44px;height:44px;border-radius:12px;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0}
.atlas-card b{font-size:14px}
.atlas-card p{font-size:12px;color:var(--mut);margin-top:2px}
.atlas-card .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.subtabs{display:flex;gap:6px;margin:.2rem 0 1rem;flex-wrap:wrap}
.notice{background:var(--panel);border:1px dashed var(--line2);border-radius:var(--rl);padding:.8rem 1rem;font-size:12.5px;color:var(--mut);margin-bottom:1rem}
.tok-line{font-family:var(--mono);font-size:11.5px;color:var(--cyan,#00E5FF)}
.res-pill{font-family:var(--mono);font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px}
.res-up{background:var(--green-soft);color:var(--green,#14F195)}
.res-dn{background:var(--red-soft);color:var(--red,#FF4D6A)}
.plan-badge{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:3px 9px;border-radius:5px}
.pb-g{background:var(--panel2);color:var(--mut)}
.pb-p{background:var(--purple-soft);color:var(--purple,#9945FF)}
.pb-x{background:var(--gold-soft);color:var(--gold,#F5B614)}

/* ═══ V2 — PROFUNDIDADE E VIDA ═══ */
body{position:relative}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:
 radial-gradient(720px 460px at 8% -6%,rgba(153,69,255,.10),transparent 65%),
 radial-gradient(640px 420px at 100% 12%,rgba(0,229,255,.06),transparent 60%),
 radial-gradient(560px 420px at 82% 100%,rgba(245,182,20,.05),transparent 62%)}
.app{position:relative;z-index:1}
.sb{background:rgba(10,14,24,.55);backdrop-filter:blur(10px)}
.mc,.card,.pool-card{background:rgba(255,255,255,.028);backdrop-filter:blur(6px);transition:border-color .18s,box-shadow .18s,transform .18s}
.mc:hover{border-color:rgba(153,69,255,.4);box-shadow:0 6px 26px rgba(0,0,0,.35),0 0 22px rgba(153,69,255,.10);transform:translateY(-2px)}
.card:hover{border-color:var(--line2);box-shadow:0 8px 30px rgba(0,0,0,.30)}
.pool-card:hover{box-shadow:0 8px 28px rgba(0,0,0,.35),0 0 24px rgba(153,69,255,.12)}
.top h1{position:relative;padding-bottom:6px}
.top h1::after{content:'';position:absolute;left:0;bottom:0;width:44px;height:3px;border-radius:2px;background:var(--acc,var(--purple,#9945FF));box-shadow:0 0 12px var(--acc,var(--purple,#9945FF))}
[data-view="dash"]{--acc:var(--purple,#9945FF)}
[data-view="hold"]{--acc:var(--gold,#F5B614)}
[data-view="defi"]{--acc:var(--green,#14F195)}
[data-view="trade"]{--acc:var(--cyan,#00E5FF)}
.sb-item.active{border-left-color:var(--acc,var(--purple,#9945FF));background:linear-gradient(90deg,rgba(255,255,255,.05),transparent)}
.hd-seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:2px}
.hd-seg button{border:none;background:transparent;color:var(--mut);font-size:11px;font-weight:700;padding:5px 12px;border-radius:99px;font-family:var(--mono)}
.hd-seg button.on{background:var(--panel2);color:var(--txt)}
.lock-ov .lockbtn{margin-top:2px}
.mini-note{font-size:11px;color:var(--mut2);margin-top:.5rem}
@media(prefers-reduced-motion:reduce){body::before{display:none}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
/* ╔══════════════════════════════════════════════════════════════╗
   ║  MUNDODEFI · PORTFÓLIO — ARQUIVO ÚNICO                        ║
   ║                                                                ║
   ║  >>> TABELA DE PLANOS — edite AQUI o que cada plano libera <<< ║
   ╚══════════════════════════════════════════════════════════════╝ */
window.MDF_PLANOS={
  gratis:{
    nome:'Grátis',
    carteiras:1,           /* máx. de carteiras */
    historico:8,           /* linhas visíveis nos históricos */
    charts:{evolucao:true, pizzaArea:true, pizzaCarteira:false,
            holdAloc:true, holdLucro:false,
            defiTaxas:true, defiProto:false,
            tradeOps:true,  tradeCurva:false},
    atlas:false
  },
  pro:{
    nome:'PRO',
    carteiras:9999,
    historico:999999,
    charts:{evolucao:true, pizzaArea:true, pizzaCarteira:true,
            holdAloc:true, holdLucro:true,

/* ── moedas e preços ── */
P.rate=1;
P.money=function(v,dec){
  if(v==null||isNaN(v))return'—';
  var brl=P.st.cfg.moeda==='brl';
  var x=brl?v*P.rate:v;
  if(dec==null)dec=Math.abs(x)>=1000?0:2;
  return (brl?'R$ ':'$')+x.toLocaleString(brl?'pt-BR':'en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});
};
P.pct=function(v){if(v==null||isNaN(v))return'—';return (v>=0?'+':'')+v.toFixed(2)+'%';};
P.cls=function(v){return v>=0?'up':'down';};
P.loadRate=function(){
  if(P.st.cfg.moeda!=='brl')return Promise.resolve();
  var c=cget('mdf.brl');if(c){P.rate=c;return Promise.resolve();}
  return jfetch(CG+'/simple/price?ids=tether&vs_currencies=brl',2).then(function(d){
    P.rate=(d.tether&&d.tether.brl)||5;cset('mdf.brl',P.rate,10*60*1000);
  }).catch(function(){P.rate=5;});
};
P.loadPrices=function(){
  var ids=[];P.st.hold.forEach(function(a){if(a.cg&&ids.indexOf(a.cg)<0)ids.push(a.cg);});
  if(!ids.length)return Promise.resolve();
  var k='mdf.px.'+ids.sort().join(',');
  var c=cget(k);
  var pr=c?Promise.resolve(c):jfetch(CG+'/simple/price?ids='+ids.join(',')+'&vs_currencies=usd',2)
    .then(function(d){cset(k,d,5*60*1000);return d;});
  return pr.then(function(d){
    P.st.hold.forEach(function(a){if(a.cg&&d[a.cg]&&d[a.cg].usd)a.last=d[a.cg].usd;});
    P.save();
  }).catch(function(){});
};

/* ── cálculos ── */
P.holdPos=function(a){
  var qb=0,inv=0,qv=0;
  a.txs.forEach(function(t){if(t.t==='c'){qb+=t.q;inv+=t.q*t.pr;}else qv+=t.q;});
  var qty=qb-qv,avg=qb?inv/qb:0,val=qty*(a.last||0);
  return{qty:qty,avg:avg,val:val,cost:qty*avg,lucro:val-qty*avg};
};
P.poolSum=function(p,arr){return (p[arr]||[]).reduce(function(s,x){return s+(Number(x.usd)||0);},0);};
P.poolLucro=function(p){
  var cur=p.st==='a'?(Number(p.cur.usd)||0):0;
  return cur+P.poolSum(p,'ret')+P.poolSum(p,'tax')-P.poolSum(p,'dep');
};
P.stratKey=function(p){return p.par+' · '+p.proto;};
P.strategies=function(){
  var map={};
  P.st.defi.pools.forEach(function(p){
    var k=P.stratKey(p);
    if(!map[k])map[k]={key:k,par:p.par,proto:p.proto,chain:p.chain,closed:[],open:[],res:0,tax:0};
    map[k][p.st==='e'?'closed':'open'].push(p);
    map[k].tax+=P.poolSum(p,'tax');
    if(p.st==='e')map[k].res+=P.poolLucro(p);
  });
  return Object.keys(map).map(function(k){return map[k];});
};
P.filtCart=function(x){var c=P.st.cfg.cart;return c==='all'||x.cart===c;};
P.totais=function(){
  var hold=0,holdL=0;
  P.st.hold.filter(P.filtCart).forEach(function(a){var x=P.holdPos(a);hold+=x.val;holdL+=x.lucro;});
  var defi=0,defiL=0,tax=0;
  P.st.defi.pools.filter(P.filtCart).forEach(function(p){
    if(p.st==='a')defi+=Number(p.cur.usd)||0;
    defiL+=P.poolLucro(p);tax+=P.poolSum(p,'tax');
  });
  var lend=0;
  P.st.defi.lend.filter(P.filtCart).forEach(function(l){if(l.st!=='a')return;lend+=l.tipo==='s'?(Number(l.usd)||0):-(Number(l.usd)||0);});
  var tr=P.st.trade,trL=tr.ops.reduce(function(s,o){return s+(Number(o.res)||0);},0);
  var pat=hold+defi+lend+(Number(tr.banca.atu)||0);
  var lucro=holdL+defiL+trL;
  var invest=pat-lucro;
  return{hold:hold,holdL:holdL,defi:defi,defiL:defiL,lend:lend,tax:tax,trade:Number(tr.banca.atu)||0,trL:trL,
    pat:pat,lucro:lucro,rent:invest>0?lucro/invest*100:0};
};
P.tradeStats=function(){
  var ops=P.st.trade.ops,w=0,res=0;
  ops.forEach(function(o){res+=Number(o.res)||0;if(o.res>0)w++;});
  return{n:ops.length,win:ops.length?w/ops.length*100:0,res:res};
};

    var v=parseFloat(el.dataset.cv);if(isNaN(v))return;

    function fmt(n){return t==='m'?P.money(n):t==='p'?P.pct(n):Math.round(n).toString();}

}

function cartVal(cid){
  var v=0;
  P.st.hold.forEach(function(a){if(a.cart===cid)v+=P.holdPos(a).val;});
  P.st.defi.pools.forEach(function(p){if(p.cart===cid&&p.st==='a')v+=Number(p.cur.usd)||0;});
  P.st.defi.lend.forEach(function(l){if(l.cart===cid&&l.st==='a')v+=l.tipo==='s'?Number(l.usd):-Number(l.usd);});
  return v;
}

function dAcao(p,tipo){
  var e=P.esc;
  var cfg={tax:['Registrar taxas coletadas','Valor coletado (US$)'],dep:['Registrar aporte','Valor do aporte (US$)'],
   ret:['Registrar retirada','Valor retirado (US$)'],reb:['Registrar rebalanceamento',null],
   nota:['Adicionar nota ao diário',null],cur:['Atualizar valor atual','Valor atual da posição (US$)']}[tipo];
  var body='';
  if(cfg[1])body+='<div class="fg"><label>'+cfg[1]+'</label><input id="aUsd" type="number" step="any"></div>';
  if(tipo==='dep'||tipo==='ret'||tipo==='cur')body+='<div class="fg"><label>Tokens (ex: 20 SOL + 1.400 USDC)</label><input id="aTok" placeholder="opcional"></div>';
  if(tipo==='reb'||tipo==='nota')body+='<div class="fg"><label>Descrição</label><textarea id="aTxt"></textarea></div>';
  body+='<div class="fg"><label>Data</label><input id="aDt" type="date" value="'+P.today()+'"></div>';
  P.modal(cfg[0]+' — '+e(p.par),body,{footer:'<button class="btn btn-p" id="okA">Salvar</button>'});
  document.getElementById('okA').onclick=function(){
    var dt=P.val('aDt')||P.today(),usd=P.num('aUsd'),txt=P.val('aTxt'),tok=P.val('aTok');
    if(tipo==='tax')p.tax.push({dt:dt,usd:usd});
    if(tipo==='dep'){p.dep.push({dt:dt,usd:usd,tok:tok});p.cur.usd=(Number(p.cur.usd)||0)+usd;}
    if(tipo==='ret'){p.ret.push({dt:dt,usd:usd,tok:tok});p.cur.usd=Math.max(0,(Number(p.cur.usd)||0)-usd);}
    if(tipo==='reb')p.reb.push({dt:dt,txt:txt});
    if(tipo==='nota')p.notas.push({dt:dt,txt:txt});
    if(tipo==='cur'){p.cur.usd=usd;if(tok)p.cur.tok=tok;}
    P.save();P.closeModal();vDefi();dDetalhe(p.id);
  };
}

   +'</div>';
  html+='<div class="tabs">'
   +'<button class="tab'+(dTab==='pools'?' on':'')+'" data-t="pools">🌊 Pools</button>'
   +'<button class="tab'+(dTab==='swaps'?' on':'')+'" data-t="swaps">🔁 Swaps</button>'
   +'<button class="tab'+(dTab==='lend'?' on':'')+'" data-t="lend">🏦 Lending</button>'
   +'</div>';
  if(dTab==='pools'){
    html+='<div class="grid2b">'
     +chartCard('defiTaxas','chDT','Taxas coletadas por mês (renda em dólar)','',true)
     +chartCard('defiProto','chDP','Distribuição por protocolo','',true)
     +'</div>';
    var strats=P.strategies().filter(function(s){return s.closed.length>0;});
    if(strats.length){
      html+=strats.map(function(s){
        return '<div class="strat-res"><span style="font-size:16px">📈</span>'
         +'<div><b>'+e(s.key)+'</b> — resultado acumulado da estratégia ('+s.closed.length+' pool'+(s.closed.length>1?'s':'')+' encerrada'+(s.closed.length>1?'s':'')+'): '
         +'<b class="'+P.cls(s.res)+'">'+P.money(s.res)+'</b>'
         +(s.open.length?' <span style="color:var(--mut);font-size:12px">· pool aberta em andamento (contada separada)</span>':'')
         +'</div></div>';
      }).join('');
    }
    html+='<div class="sb-sec" style="padding-left:0">Pools abertas</div>';
    html+=abertas.length?'<div class="pool-grid">'+abertas.map(dCard).join('')+'</div>':'<div class="empty">Nenhuma pool aberta — crie a primeira em <b>+ Adicionar</b>.</div>';
    var enc=pools.filter(function(p){return p.st==='e';});
    var lim=Math.min(P.histLim(),1000);
    html+='<div class="sb-sec" style="padding-left:0;margin-top:1rem">Histórico — pools encerradas (nada é apagado)</div>';
    if(enc.length){
      var rows=enc.slice(0,lim).map(function(p){
        var L=P.poolLucro(p);
        return '<tr style="cursor:pointer" data-p="'+p.id+'"><td><div class="pool-name">'+e(p.par)+'</div><div class="pool-proj">'+e(p.proto)+'</div></td>'
         +'<td><span class="tag">'+e(p.chain)+'</span></td>'
         +'<td class="mono" style="color:var(--mut)">'+P.dBR(p.ab)+' → '+P.dBR(p.en)+'</td>'
         +'<td class="num mono">'+P.money(P.poolSum(p,'dep'))+'</td>'
         +'<td class="num mono" style="color:var(--cyan,#00E5FF)">'+P.money(P.poolSum(p,'tax'))+'</td>'
         +'<td class="num"><span class="res-pill '+(L>=0?'res-up':'res-dn')+'">'+P.money(L)+'</span></td></tr>';
      }).join('');
      if(enc.length>lim)rows+='<tr class="lockrow"><td colspan="6">🔒 Ver todo o histórico de pools — PRO</td></tr>';
      html+='<div class="card"><div class="tblw"><table style="min-width:720px"><thead><tr><th>Pool</th><th>Chain</th><th>Período</th><th class="num">Depositado</th><th class="num">Taxas</th><th class="num">Resultado</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
    }else html+='<div class="empty">Nenhuma pool encerrada ainda.</div>';
  }
  if(dTab==='swaps'){
    var sw=P.st.defi.swaps.filter(P.filtCart).slice().sort(function(a,b){return String(b.dt).localeCompare(String(a.dt));});
    var limS=P.histLim();
    var rowsS=sw.slice(0,limS).map(function(s){
      return '<tr><td class="mono" style="color:var(--mut)">'+P.dBR(s.dt)+'</td>'
       +'<td class="mono"><b>'+e(s.deQ)+' '+e(s.deT)+'</b> → <b style="color:var(--green,#14F195)">'+e(s.paQ)+' '+e(s.paT)+'</b></td>'
       +'<td style="color:var(--mut);font-size:12px;max-width:340px">'+e(s.mot||'—')+'</td></tr>';
    }).join('');
    if(sw.length>limS)rowsS+='<tr class="lockrow"><td colspan="3">🔒 Ver todos os swaps — PRO</td></tr>';
    html+='<div class="notice">Todo swap fica registrado: quantidade, data e motivo. É assim que você estuda suas próprias decisões depois.</div>'
     +'<div class="card"><div class="tblw"><table style="min-width:560px"><thead><tr><th>Data</th><th>Troca</th><th>Motivo</th></tr></thead><tbody>'
     +(rowsS||'<tr><td colspan="3"><div class="empty">Nenhum swap registrado</div></td></tr>')+'</tbody></table></div></div>';
  }
  if(dTab==='lend'){
    var ld=P.st.defi.lend.filter(P.filtCart);
    var rowsL=ld.map(function(l){
      return '<tr><td><b>'+e(l.plat)+'</b></td><td><span class="tag">'+e(l.chain)+'</span></td>'
       +'<td><span class="badge '+(l.tipo==='s'?'b-open':'b-closed')+'">'+(l.tipo==='s'?'Supply':'Borrow')+'</span></td>'
       +'<td class="mono">'+e(l.q)+' '+e(l.tk)+'</td>'
       +'<td class="num mono">'+P.money(l.usd)+'</td>'
       +'<td class="num mono" style="color:var(--green,#14F195)">'+(l.apy?l.apy.toFixed(1)+'%':'—')+'</td></tr>';
    }).join('');
    html+='<div class="card"><div class="tblw"><table style="min-width:620px"><thead><tr><th>Plataforma</th><th>Chain</th><th>Tipo</th><th>Posição</th><th class="num">Valor</th><th class="num">APY</th></tr></thead><tbody>'
     +(rowsL||'<tr><td colspan="6"><div class="empty">Nenhuma posição de lending</div></td></tr>')+'</tbody></table></div></div>';
  }
  document.getElementById('pg').innerHTML=html;
  document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){dTab=b.dataset.t;vDefi();};});
  document.querySelectorAll('[data-p]').forEach(function(el){el.onclick=function(){dDetalhe(el.dataset.p);};});
  if(dTab==='pools'){
    var r=rt();
    var mm={},labs=[];
    for(var i=5;i>=0;i--){var d=new Date();d.setMonth(d.getMonth()-i);var k=d.toISOString().slice(0,7);mm[k]=0;labs.push(k);}
    pools.forEach(function(p){p.tax.forEach(function(t){var k=String(t.dt||'').slice(0,7);if(k in mm)mm[k]+=Number(t.usd)||0;});});
    mkChart('chDT',{type:'bar',data:{labels:labs.map(function(k){var p=k.split('-');return p[1]+'/'+p[0].slice(2);}),
     datasets:[{data:labs.map(function(k){return Math.round(mm[k]*r);}),backgroundColor:'rgba(0,229,255,.55)',borderColor:'#00E5FF',borderWidth:1.5,borderRadius:6}]},
     options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:moneyCb()}}},scales:{x:{grid:{display:false},ticks:gTicks()},y:{grid:gGrid(),ticks:gTicks()}}}});
    var pm={};
    abertas.forEach(function(p){pm[p.proto]=(pm[p.proto]||0)+(Number(p.cur.usd)||0);});
    var pl=Object.keys(pm);
    mkChart('chDP',{type:'doughnut',data:{labels:pl,datasets:[{data:pl.map(function(k){return pm[k]*r;}),backgroundColor:['#14F195','#9945FF','#F5B614','#00E5FF','#FF4D6A'],borderColor:'#0C101C',borderWidth:3}]},
     options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'right',labels:{color:'#8B93A7',font:{family:'Space Mono',size:11},boxWidth:11,boxHeight:11}},tooltip:{callbacks:{label:moneyCb()}}}}});
  }
  countUps();
}

/* ══════════ ROTEADOR ══════════ */
var VIEWS={dash:vDash,hold:vHold,defi:vDefi,trade:vTrade};
function go(v){
  if(!VIEWS[v])v='dash';
  VIEW=v;
  document.body.dataset.view=v;
  document.querySelectorAll('[data-go]').forEach(function(b){b.classList.toggle('active',b.dataset.go===v);});
  VIEWS[v]();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',function(){go(location.hash.replace('#','')||'dash');});
window._go=go; /* hook interno p/ testes */
P.load();
shell();
P.loadRate().then(function(){
  go(location.hash.replace('#','')||'dash');
  P.loadPrices().then(function(){go(VIEW);});
});
})();
</script>
