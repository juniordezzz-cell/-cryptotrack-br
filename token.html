<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title id="page-title">Token — MundoDeFi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>
<style>
:root{
  --bg:#05060b;--bg2:#0a0b12;--bg3:#0f1018;--bg4:#141520;--bg5:#191b28;
  --border:rgba(255,255,255,0.05);--border2:rgba(255,255,255,0.09);--border3:rgba(255,255,255,0.14);
  --gold:#f5a623;--gold2:rgba(245,166,35,0.1);--gold3:rgba(245,166,35,0.05);--gold4:rgba(245,166,35,0.22);
  --green:#00e5a0;--green2:rgba(0,229,160,0.1);--green3:#00c488;
  --red:#ff3d5a;--red2:rgba(255,61,90,0.1);
  --blue:#3d8bff;--blue2:rgba(61,139,255,0.1);--purple:#9b59f5;--cyan:#00d4ff;
  --text:#f0f0fa;--muted:#3a3c52;--muted2:#7a7c96;--muted3:#5a5c78;
  --font:'Space Grotesk',sans-serif;--display:'Bebas Neue',sans-serif;--mono:'JetBrains Mono',monospace;
  --r:8px;--rl:12px;--rxl:18px;
  --glow-gold:0 0 20px rgba(245,166,35,0.15);
  --glow-green:0 0 20px rgba(0,229,160,0.15);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:14px}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(245,166,35,0.04) 0%,transparent 60%);pointer-events:none;z-index:0}

/* ── NAV ── */
nav{position:sticky;top:0;z-index:300;background:rgba(5,6,11,0.95);backdrop-filter:blur(24px);border-bottom:1px solid var(--border)}
.nav-top{display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;height:54px;max-width:1600px;margin:0 auto;gap:12px}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0}
.nav-logo-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--gold),#e08800);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:14px;color:#000;font-weight:400;letter-spacing:.05em}
.nav-logo-text{font-family:var(--display);font-size:20px;letter-spacing:.06em;line-height:1}
.nav-logo-text span{color:var(--gold)}
.nav-links{display:flex;align-items:center;gap:2px;flex:1;justify-content:center}
.nav-link{padding:6px 12px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--muted2);text-decoration:none;transition:all .15s;white-space:nowrap;letter-spacing:.01em}
.nav-link:hover{color:var(--text);background:var(--bg3)}
.nav-right{display:flex;align-items:center;gap:8px;flex-shrink:0}

/* search */
.nav-token-search{position:relative;flex-shrink:0}
.nav-token-input{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);padding:7px 13px 7px 32px;font-size:12px;color:var(--text);font-family:var(--font);width:220px;outline:none;transition:all .2s;letter-spacing:.01em}
.nav-token-input:focus{border-color:rgba(245,166,35,.4);width:280px;background:var(--bg4);box-shadow:0 0 0 3px rgba(245,166,35,.06)}
.nav-token-input::placeholder{color:var(--muted)}
.nav-search-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;pointer-events:none;color:var(--muted)}
.nav-token-dd{position:absolute;top:calc(100% + 8px);right:0;width:360px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--rl);box-shadow:0 24px 64px rgba(0,0,0,.8);z-index:400;display:none;max-height:440px;overflow-y:auto}
.nav-token-dd.open{display:block}
.ntdd-hdr{padding:10px 14px 5px;font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.ntdd-item{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;transition:background .12s;text-decoration:none;color:var(--text)}
.ntdd-item:hover{background:var(--bg3)}
.ntdd-ico{width:28px;height:28px;border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--bg4)}
.ntdd-name{font-size:12.5px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ntdd-sym{font-size:10px;color:var(--muted2);font-family:var(--mono)}
.ntdd-price{font-size:11px;font-family:var(--mono);color:var(--muted2)}
.ntdd-chg{font-size:10px;font-family:var(--mono);font-weight:700;text-align:right;min-width:52px}
.ntdd-empty{padding:1.4rem;text-align:center;font-size:12px;color:var(--muted2)}

.nbtn{padding:6px 14px;border-radius:var(--r);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all .15s;text-decoration:none;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;letter-spacing:.01em}
.nbtn-ghost{background:transparent;border:1px solid var(--border2);color:var(--muted2)}
.nbtn-ghost:hover{color:var(--text);border-color:var(--border3)}
.nbtn-pro{background:linear-gradient(135deg,var(--gold),#d47e00);border:none;color:#000;font-weight:700}
.nbtn-pro:hover{opacity:.88;transform:translateY(-1px);box-shadow:var(--glow-gold)}

/* ── TICKER ── */
.ticker-strip{background:var(--bg2);border-bottom:1px solid var(--border);height:32px;overflow:hidden;position:relative}
.ticker-strip::before,.ticker-strip::after{content:'';position:absolute;top:0;bottom:0;width:60px;z-index:2;pointer-events:none}
.ticker-strip::before{left:0;background:linear-gradient(to right,var(--bg2),transparent)}
.ticker-strip::after{right:0;background:linear-gradient(to left,var(--bg2),transparent)}
.ticker-track{display:flex;align-items:center;height:100%;white-space:nowrap;animation:tickScroll 60s linear infinite}
.ticker-track:hover{animation-play-state:paused}
@keyframes tickScroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.t-item{display:inline-flex;align-items:center;gap:6px;padding:0 16px;height:100%;border-right:1px solid var(--border)}
.t-sym{font-family:var(--mono);font-weight:600;font-size:10.5px;color:var(--muted2)}
.t-price{font-family:var(--mono);font-size:10.5px;color:var(--text);font-weight:500}
.t-chg{font-family:var(--mono);font-size:10px;font-weight:700}
.t-chg.up{color:var(--green)}.t-chg.dn{color:var(--red)}.t-chg.nt{color:var(--muted2)}
.t-dot{width:4px;height:4px;border-radius:50%;flex-shrink:0}
.t-dot.up{background:var(--green)}.t-dot.dn{background:var(--red)}.t-dot.nt{background:var(--muted)}

/* ── HERO ── */
.token-hero-wrap{max-width:1600px;margin:0 auto;padding:1.2rem 1.5rem .8rem;position:relative;z-index:1}
.breadcrumb{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted2);margin-bottom:1rem}
.breadcrumb a{color:var(--muted2);text-decoration:none;transition:color .15s}
.breadcrumb a:hover{color:var(--text)}
.bc-sep{opacity:.3}.bc-cur{color:var(--text);font-weight:600}

.hero-top{display:flex;align-items:flex-start;gap:1.4rem;flex-wrap:wrap}
.hero-left{flex:1;min-width:280px}
.hero-logo-row{display:flex;align-items:center;gap:12px;margin-bottom:.7rem}
.hero-logo{width:48px;height:48px;border-radius:50%;border:2px solid var(--border2);background:var(--bg3);object-fit:cover;flex-shrink:0}
.hero-name{font-family:var(--display);font-size:2rem;letter-spacing:.06em;line-height:1;color:var(--text)}
.hero-meta{display:flex;align-items:center;gap:6px;margin-top:.35rem;flex-wrap:wrap}
.hero-sym{font-family:var(--mono);font-size:11px;color:var(--muted2);background:var(--bg3);border:1px solid var(--border);padding:2px 9px;border-radius:99px;font-weight:500}
.hero-rank{font-family:var(--mono);font-size:11px;color:var(--gold);background:var(--gold3);border:1px solid rgba(245,166,35,.2);padding:2px 9px;border-radius:99px;font-weight:700}
.hero-tag{font-size:9px;font-weight:700;padding:2px 9px;border-radius:99px;border:1px solid var(--border);color:var(--muted2);background:var(--bg3);text-transform:uppercase;letter-spacing:.07em;cursor:pointer;transition:all .15s}
.hero-tag:hover{border-color:var(--blue);color:var(--blue)}
.hero-tag.l1{border-color:rgba(0,212,255,.25);color:var(--cyan);background:rgba(0,212,255,.06)}
.hero-tag.l2{border-color:rgba(155,89,245,.25);color:var(--purple);background:rgba(155,89,245,.06)}
.hero-tag.defi{border-color:rgba(0,229,160,.25);color:var(--green);background:rgba(0,229,160,.06)}

.hero-right{text-align:right;flex-shrink:0}
.hero-price{font-family:var(--mono);font-size:2.8rem;font-weight:700;letter-spacing:-.04em;line-height:1;transition:color .3s}
.hero-chg-row{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:.4rem;flex-wrap:wrap}
.chg-badge{font-family:var(--mono);font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;display:inline-flex;align-items:center;gap:3px}
.chg-badge.up{background:var(--green2);color:var(--green);border:1px solid rgba(0,229,160,.15)}
.chg-badge.dn{background:var(--red2);color:var(--red);border:1px solid rgba(255,61,90,.15)}
.chg-badge.nt{background:var(--bg3);color:var(--muted2);border:1px solid var(--border)}
.hero-sub-row{display:flex;gap:10px;justify-content:flex-end;margin-top:.35rem;flex-wrap:wrap}
.sub-price{font-size:12px;color:var(--muted2);font-family:var(--mono)}

/* ── CHG BAR ── */
.chg-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:.9rem;margin-bottom:.7rem}
.chg-cell{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:.6rem .8rem;text-align:center;transition:all .2s;cursor:default}
.chg-cell:hover{border-color:var(--border2);background:var(--bg4);transform:translateY(-1px)}
.chg-cell-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:.25rem}
.chg-cell-val{font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:-.02em}
.chg-cell-val.up{color:var(--green)}.chg-cell-val.dn{color:var(--red)}.chg-cell-val.nt{color:var(--muted2)}

/* ── QUICK STATS ── */
.quick-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:.9rem}
@media(max-width:900px){.quick-stats{grid-template-columns:repeat(2,1fr)}}
.qs-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:.75rem 1rem;transition:all .2s}
.qs-card:hover{border-color:var(--border2);background:var(--bg3)}
.qs-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:.3rem;display:flex;align-items:center;gap:4px}
.qs-val{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--text);letter-spacing:-.01em}
.qs-sub{font-size:10px;color:var(--muted2);margin-top:2px;font-family:var(--mono)}
.qs-chg{font-family:var(--mono);font-size:11px;font-weight:700}
.qs-chg.up{color:var(--green)}.qs-chg.dn{color:var(--red)}

/* ── LAYOUT ── */
.page-body{max-width:1600px;margin:0 auto;padding:0 1.5rem 5rem;display:grid;grid-template-columns:1fr 320px;gap:14px;align-items:start;position:relative;z-index:1}
@media(max-width:1100px){.page-body{grid-template-columns:1fr}}

/* ── TABS ── */
.tabs-row{display:flex;gap:1px;border-bottom:1px solid var(--border);margin-bottom:12px;overflow-x:auto;scrollbar-width:none;position:relative}
.tabs-row::-webkit-scrollbar{display:none}
.tab-btn{padding:9px 16px;font-size:12.5px;font-weight:600;color:var(--muted2);background:transparent;border:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s;white-space:nowrap;font-family:var(--font);letter-spacing:.01em}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--gold);border-bottom-color:var(--gold)}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* ── CARD ── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;margin-bottom:12px}
.card:last-child{margin-bottom:0}
.card-hdr{padding:.8rem 1.1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card-ttl{font-family:var(--display);font-size:13px;letter-spacing:.08em;color:var(--muted2);text-transform:uppercase}
.card-ttl-badge{display:flex;align-items:center;gap:6px}

/* ── TRADINGVIEW ── */
.tv-wrap{height:560px;background:var(--bg)}
.tv-wrap iframe{width:100%;height:100%;border:none}

/* ── CHART FALLBACK ── */
.chart-wrap{height:240px;padding:.8rem;position:relative}
.chart-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:6px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--gold);animation:dp 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes dp{0%,80%,100%{opacity:.2}40%{opacity:1}}
.period-btns{display:flex;gap:3px}
.period-btn{padding:3px 10px;border-radius:99px;border:1px solid var(--border);font-size:10px;font-weight:600;color:var(--muted2);cursor:pointer;background:transparent;transition:all .15s;font-family:var(--mono)}
.period-btn:hover{color:var(--text)}
.period-btn.active{background:var(--gold2);border-color:rgba(245,166,35,.3);color:var(--gold)}

/* ── SENTIMENT ── */
.sentiment-wrap{padding:1rem 1.1rem}
.sent-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:.7rem}
.sent-bull{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--green);min-width:48px}
.sent-bear{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--red);min-width:48px;text-align:right}
.sent-bar-track{flex:1;height:8px;background:var(--bg4);border-radius:99px;overflow:hidden}
.sent-bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green),var(--green3));transition:width .6s ease}
.sent-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted2)}
.vote-btns{display:flex;gap:8px;margin-top:.9rem}
.vote-btn{flex:1;padding:8px;border-radius:var(--r);border:1px solid var(--border);background:transparent;color:var(--muted2);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all .18s;display:flex;align-items:center;justify-content:center;gap:6px}
.vote-btn.bull:hover{background:var(--green2);border-color:rgba(0,229,160,.3);color:var(--green)}
.vote-btn.bear:hover{background:var(--red2);border-color:rgba(255,61,90,.3);color:var(--red)}
.vote-btn.active-bull{background:var(--green2);border-color:rgba(0,229,160,.3);color:var(--green)}
.vote-btn.active-bear{background:var(--red2);border-color:rgba(255,61,90,.3);color:var(--red)}

/* ── AI ── */
.ai-wrap{padding:1.1rem}
.ai-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.9rem;flex-wrap:wrap;gap:8px}
.ai-badge{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(135deg,rgba(155,89,245,.14),rgba(61,139,255,.1));border:1px solid rgba(155,89,245,.25);border-radius:99px;padding:5px 14px;font-size:11px;font-weight:600;color:#c084fc;letter-spacing:.02em}
.ai-pulse{width:7px;height:7px;border-radius:50%;background:#c084fc;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.4)}}
.ai-lang-btn{font-size:11px;color:var(--gold);cursor:pointer;background:none;border:1px solid var(--border);border-radius:99px;font-family:var(--font);padding:4px 12px;transition:all .15s;font-weight:600}
.ai-lang-btn:hover{border-color:var(--gold);background:var(--gold3)}
.ai-body{font-size:13px;color:var(--muted2);line-height:1.9;font-weight:400}
.ai-body strong{color:var(--text);font-weight:600}
.ai-skel{height:12px;border-radius:4px;margin-bottom:8px;background:linear-gradient(90deg,var(--bg3) 25%,var(--bg4) 50%,var(--bg3) 75%);background-size:200% 100%;animation:skelShim 1.4s infinite}
@keyframes skelShim{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── FUNDAMENTALS ── */
.fund-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border)}
@media(max-width:640px){.fund-grid{grid-template-columns:1fr 1fr}}
.fund-item{background:var(--bg2);padding:.8rem 1rem;transition:background .15s}
.fund-item:hover{background:var(--bg3)}
.fund-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:.3rem}
.fund-val{font-family:var(--mono);font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.fund-sub{font-size:10px;color:var(--muted2);margin-top:2px}
.supply-bar-wrap{padding:.8rem 1.1rem;border-top:1px solid var(--border)}
.supply-bar-lbl{display:flex;justify-content:space-between;font-size:10px;color:var(--muted2);margin-bottom:.5rem}
.supply-bar-bg{height:5px;background:var(--bg4);border-radius:99px;overflow:hidden}
.supply-bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),#d47e00);transition:width .8s ease}

/* ── MARKETS TABLE ── */
.table-wrap{overflow-x:auto}
.data-table{width:100%;border-collapse:collapse;font-size:12px}
.data-table th{padding:.6rem .9rem;text-align:left;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap}
.data-table td{padding:.7rem .9rem;border-bottom:1px solid var(--border);vertical-align:middle}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:var(--bg3)}
.ex-logo{width:18px;height:18px;border-radius:4px;object-fit:cover;margin-right:6px;vertical-align:middle;background:var(--bg3)}
.ex-name{font-weight:600;vertical-align:middle;color:var(--text)}
.pair-badge{font-family:var(--mono);font-size:11px;background:var(--bg3);padding:2px 8px;border-radius:5px;border:1px solid var(--border)}
.pct-bar{height:3px;background:var(--bg4);border-radius:99px;overflow:hidden;margin-top:4px;width:80px}
.pct-bar-fill{height:100%;background:var(--blue);border-radius:99px}
.buy-btn{display:inline-flex;align-items:center;gap:3px;padding:4px 10px;border-radius:6px;background:var(--green2);border:1px solid rgba(0,229,160,.2);color:var(--green);font-size:10px;font-weight:700;text-decoration:none;transition:all .15s;white-space:nowrap}
.buy-btn:hover{background:rgba(0,229,160,.18);box-shadow:var(--glow-green)}
.liq-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
.liq-dot.high{background:var(--green)}.liq-dot.med{background:var(--gold)}.liq-dot.low{background:var(--red)}

/* ── ABOUT ── */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:1.1rem}
@media(max-width:640px){.about-grid{grid-template-columns:1fr}}
.about-desc{grid-column:1/-1;font-size:13px;color:var(--muted2);line-height:1.85;border:1px solid var(--border);border-radius:var(--r);padding:1rem;background:var(--bg3)}
.about-desc.collapsed{max-height:120px;overflow:hidden;position:relative}
.about-desc.collapsed::after{content:'';position:absolute;bottom:0;left:0;right:0;height:40px;background:linear-gradient(transparent,var(--bg3))}
.read-more-btn{background:none;border:none;color:var(--gold);cursor:pointer;font-size:12px;font-family:var(--font);padding:.35rem 0;margin-top:.35rem;font-weight:600}
.info-row{display:flex;flex-direction:column;gap:7px}
.info-item{display:flex;align-items:center;justify-content:space-between;padding:.55rem .8rem;background:var(--bg3);border-radius:var(--r);border:1px solid var(--border)}
.info-key{font-size:10.5px;color:var(--muted2);font-weight:500}
.info-val{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--text)}
.links-grid{display:flex;flex-direction:column;gap:5px}

<script>
// ══ UTILS ══
function fmtP(v){
  if(v===null||v===undefined||isNaN(v))return'—';
  if(v>=1000)return'$'+v.toLocaleString('en-US',{maximumFractionDigits:0});
  if(v>=1)return'$'+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:4});
  if(v>=0.01)return'$'+v.toLocaleString('en-US',{minimumFractionDigits:4,maximumFractionDigits:6});
  return'$'+v.toLocaleString('en-US',{minimumFractionDigits:6,maximumFractionDigits:8});
}
function fmtBRL(v,r){if(!v||!r)return'—';var b=v*r;if(b>=1e9)return'R$'+(b/1e9).toFixed(2)+'B';if(b>=1e6)return'R$'+(b/1e6).toFixed(2)+'M';if(b>=1000)return'R$'+b.toLocaleString('pt-BR',{maximumFractionDigits:0});return'R$'+b.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:4});}
function fmtC(v){if(v===null||v===undefined)return'—';return(v>=0?'+':'')+v.toFixed(2)+'%';}
function fmtB(v){if(!v&&v!==0)return'—';if(v>=1e12)return'$'+(v/1e12).toFixed(2)+'T';if(v>=1e9)return'$'+(v/1e9).toFixed(2)+'B';if(v>=1e6)return'$'+(v/1e6).toFixed(2)+'M';return'$'+v.toLocaleString('en-US',{maximumFractionDigits:0});}
function fmtN(v){if(!v&&v!==0)return'—';return v.toLocaleString('en-US',{maximumFractionDigits:0});}
function clr(v){return v===null||v===undefined?'nt':v>=0?'up':'dn';}
function shortAddr(a){return a?a.slice(0,6)+'…'+a.slice(-4):'';}
function dateStr(s){if(!s)return'—';var d=new Date(s);return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'});}

// ══ CORS PROXY ══ (com timeout)
var CG_PROXIES=['https://corsproxy.io/?url=','https://api.allorigins.win/raw?url='];
function makeFakeResp(json,status){return{ok:status>=200&&status<300,status:status,json:function(){return Promise.resolve(json);}};}
async function cgFetch(url){
  for(var i=0;i<CG_PROXIES.length;i++){
    try{
      var ctrl=new AbortController();
      var tid=setTimeout(function(){ctrl.abort();},5000); // 5s timeout por proxy
      var r=await fetch(CG_PROXIES[i]+encodeURIComponent(url),{signal:ctrl.signal});
      clearTimeout(tid);
      if(!r.ok&&r.status!==404)continue;
      var text=await r.text();
      var parsed=JSON.parse(text);
      if(parsed&&typeof parsed.contents==='string'){try{parsed=JSON.parse(parsed.contents);}catch(e2){}}
      return makeFakeResp(parsed,r.status);
    }catch(e){clearTimeout&&clearTimeout();}
  }
  // fallback direto
  try{return await fetch(url);}catch(e){return makeFakeResp({error:'network'},503);}
}

  var isUp=values[values.length-1]>=values[0];

function getFGColor(val){

  if(val<=45)return'#ff8c42';

  if(val<=75)return'#00d4ff';

}
function getFGLabel(val){
  if(val<=10)return'Medo Extremo';
  if(val<=25)return'Medo';
  if(val<=45)return'Medo';
  if(val<=55)return'Neutro';

function drawFGGauge(val,canvasId){
  var canvas=document.getElementById(canvasId);if(!canvas)return;
  var ctx=canvas.getContext('2d');
  var W=canvas.width,H=canvas.height;
  ctx.clearRect(0,0,W,H);
  var cx=W/2,cy=H-10,r=H-20;
  // background arc
  ctx.beginPath();ctx.arc(cx,cy,r,Math.PI,2*Math.PI,false);
  ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=14;ctx.lineCap='round';ctx.stroke();
  // colored arc
  var angle=Math.PI+(val/100)*Math.PI;
  var gradient=ctx.createLinearGradient(cx-r,cy,cx+r,cy);
  gradient.addColorStop(0,'#ff3d5a');gradient.addColorStop(.5,'#f5a623');gradient.addColorStop(1,'#00e5a0');
  ctx.beginPath();ctx.arc(cx,cy,r,Math.PI,angle,false);
  ctx.strokeStyle=gradient;ctx.lineWidth=14;ctx.lineCap='round';ctx.stroke();
  // needle
  var needleAngle=Math.PI+(val/100)*Math.PI;
  ctx.save();ctx.translate(cx,cy);ctx.rotate(needleAngle);
  ctx.beginPath();ctx.moveTo(-3,0);ctx.lineTo(0,-(r-4));ctx.lineTo(3,0);
  ctx.fillStyle='#f0f0fa';ctx.fill();ctx.restore();
  ctx.beginPath();ctx.arc(cx,cy,6,0,2*Math.PI);ctx.fillStyle='#f0f0fa';ctx.fill();
}

  var val=parseInt(data.value)||50;
  var color=getFGColor(val);

// ══ POSITION CALCULATOR ══
function calcPosition(){
  var entry=parseFloat(document.getElementById('calc-entry').value)||0;
  var stop=parseFloat(document.getElementById('calc-stop').value)||0;
  var target=parseFloat(document.getElementById('calc-target').value)||0;
  var capital=parseFloat(document.getElementById('calc-capital').value)||0;
  var riskPct=parseFloat(document.getElementById('calc-risk').value)||2;
  if(!entry||!stop||!capital){alert('Preencha entrada, stop e capital.');return;}
  var riskPerTrade=capital*(riskPct/100);
  var stopDist=Math.abs(entry-stop);
  var stopPct=(stopDist/entry)*100;
  var positionSize=stopDist>0?riskPerTrade/stopDist:0;
  var positionValue=positionSize*entry;
  var targetProfit=target?positionSize*(target-entry):0;
  var rr=target&&stopDist>0?Math.abs(target-entry)/stopDist:0;
  var rrColor=rr>=2?'var(--green)':rr>=1?'var(--gold)':'var(--red)';
  document.getElementById('calc-res-size').textContent=positionSize>0?positionSize.toFixed(4)+' unid.':'—';
  document.getElementById('calc-res-value').textContent=positionValue>0?fmtBRL(positionValue,1/(_usdBRL||5.7)||1):fmtP(positionValue);
  document.getElementById('calc-res-risk').textContent=riskPerTrade>0?'$'+riskPerTrade.toFixed(2)+' ('+riskPct+'%)':'—';
  document.getElementById('calc-res-profit').textContent=targetProfit?'$'+targetProfit.toFixed(2):'—';
  document.getElementById('calc-res-stopPct').textContent=stopPct?stopPct.toFixed(2)+'%':'—';
  var rrEl=document.getElementById('calc-res-rr');
  if(rrEl){rrEl.textContent=rr>0?'1:'+rr.toFixed(2):'—';rrEl.style.color=rrColor;}
}

async function loadCompare(id1,id2,symbol1){
  var wrap=document.getElementById('compare-body');if(!wrap)return;
  wrap.innerHTML='<div style="padding:1rem;text-align:center;font-size:12px;color:var(--muted2)">Carregando comparação...</div>';
  try{
    var r=await cgFetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids='+id1+','+id2+'&order=market_cap_desc');
    var coins=await r.json();
    if(!Array.isArray(coins)||coins.length<2){wrap.innerHTML='<div style="padding:1rem;text-align:center;font-size:12px;color:var(--muted2)">Token não encontrado. Tente outro ID (ex: ethereum, solana).</div>';return;}
    var a=coins.find(function(c){return c.id===id1;})||coins[0];
    var b=coins.find(function(c){return c.id===id2;})||coins[1];
    function better(va,vb,higherIsBetter){
      if(va===null||va===undefined||vb===null||vb===undefined)return['neutral','neutral'];
      return higherIsBetter?[(va>vb?'better':'worse'),(vb>va?'better':'worse')]:[(va<vb?'better':'worse'),(vb<va?'better':'worse')];
    }
    var rows=[
      {label:'Preço',va:fmtP(a.current_price),vb:fmtP(b.current_price),c:better(a.current_price,b.current_price,true)},
      {label:'Market Cap',va:fmtB(a.market_cap),vb:fmtB(b.market_cap),c:better(a.market_cap,b.market_cap,true)},
      {label:'Volume 24h',va:fmtB(a.total_volume),vb:fmtB(b.total_volume),c:better(a.total_volume,b.total_volume,true)},
      {label:'Var 24h',va:fmtC(a.price_change_percentage_24h),vb:fmtC(b.price_change_percentage_24h),c:better(a.price_change_percentage_24h,b.price_change_percentage_24h,true)},
      {label:'Var 7d',va:fmtC(a.price_change_percentage_7d_in_currency),vb:fmtC(b.price_change_percentage_7d_in_currency),c:better(a.price_change_percentage_7d_in_currency,b.price_change_percentage_7d_in_currency,true)},
      {label:'ATH',va:fmtP(a.ath),vb:fmtP(b.ath),c:better(a.ath,b.ath,true)},
      {label:'Rank',va:a.market_cap_rank?'#'+a.market_cap_rank:'—',vb:b.market_cap_rank?'#'+b.market_cap_rank:'—',c:better(a.market_cap_rank,b.market_cap_rank,false)},
    ];
    var html='<table class="compare-table"><thead><tr><th>Métrica</th><th><img src="'+(a.image||'')+'" width="14" height="14" style="border-radius:50%;margin-right:4px;vertical-align:middle">'+a.symbol.toUpperCase()+'</th><th><img src="'+(b.image||'')+'" width="14" height="14" style="border-radius:50%;margin-right:4px;vertical-align:middle">'+b.symbol.toUpperCase()+'</th></tr></thead><tbody>';
    rows.forEach(function(row){
      html+='<tr><td style="color:var(--muted2);font-family:var(--font)">'+row.label+'</td>'
        +'<td>'+row.va+' <span class="compare-badge '+row.c[0]+'">'+(row.c[0]==='better'?'↑ Melhor':row.c[0]==='worse'?'↓':'—')+'</span></td>'
        +'<td>'+row.vb+' <span class="compare-badge '+row.c[1]+'">'+(row.c[1]==='better'?'↑ Melhor':row.c[1]==='worse'?'↓':'—')+'</span></td>'
        +'</tr>';
    });
    html+='</tbody></table>';
    wrap.innerHTML=html;
  }catch(e){wrap.innerHTML='<div style="padding:1rem;text-align:center;font-size:12px;color:var(--muted2)">Erro ao carregar dados de comparação.</div>';}
}

function startAlertCheck(){
  if(_alertCheckInterval)return;
  _alertCheckInterval=setInterval(function(){
    if(!_data)return;
    var cur=_data.market_data.current_price.usd;
    _alerts.forEach(function(a){
      if(a.triggered)return;
      var triggered=false;
      if(a.type==='above'&&cur>=a.price)triggered=true;
      if(a.type==='below'&&cur<=a.price)triggered=true;

  html+='<div class="sidebar-card"><div class="sc-hdr">Tokens Similares</div><div>';
  similar.forEach(function(c){
    var cChg=c.price_change_percentage_24h;
    html+='<a class="similar-item" href="token.html?id='+c.id+'">'
      +'<img class="similar-ico" src="'+(c.image||'')+'" onerror="this.style.background=\'var(--bg4)\'" loading="lazy">'
      +'<div><div class="similar-name">'+c.name+'</div><div class="similar-sym">'+c.symbol.toUpperCase()+'</div></div>'
      +'<div><div class="similar-price">'+fmtP(c.current_price)+'</div>'
      +(cChg!==null&&cChg!==undefined?'<div class="similar-chg" style="color:'+(cChg>=0?'var(--green)':'var(--red)')+'">'+fmtC(cChg)+'</div>':'')
      +'</div></a>';
  });
  html+='</div></div>';

  html+='</div>'; // sidebar
  html+='</div>'; // page-body

  document.getElementById('app').innerHTML=html;

  // POST-RENDER (non-blocking)
  setTimeout(function(){
    if(chartPts&&chartPts.length)drawChart(chartPts);
    var sf=document.getElementById('supply-bar-fill');if(sf&&supplyPct)sf.style.width=Math.min(supplyPct,100)+'%';
    fetchFearGreed();
    if(rawDesc){
      translateText(rawDesc).then(function(pt){
        var el=document.getElementById('about-desc');
        if(el)el.innerHTML=pt;
      }).catch(function(){});
    }
  },120);

  _aiParams={name:name,symbol:symbol,price:fmtP(price),chg24:fmtC(chg24),chg7:fmtC(chg7),chg30:fmtC(chg30),mcap:fmtB(mcap),vol:fmtB(vol),ath:fmtP(ath),athChg:athChg?athChg.toFixed(1)+'%':'—',rank:rank||'—',layer:layerInfo.label};
}

// ══ INIT ══
async function init(){
  _coinId=getCoinId();
  if(!_coinId){showError('Nenhum token especificado. Use <strong>token.html?id=bitcoin</strong>');return;}
  try{
    var [coinResp,chartResp]=await Promise.all([
      cgFetch('https://api.coingecko.com/api/v3/coins/'+_coinId+'?localization=false&tickers=true&market_data=true&community_data=true&developer_data=true&sparkline=false'),
      cgFetch('https://api.coingecko.com/api/v3/coins/'+_coinId+'/market_chart?vs_currency=usd&days=7')
    ]);
    if(!coinResp.ok){
      if(coinResp.status===404){showError('Token <strong>'+_coinId+'</strong> não encontrado no CoinGecko.');}
      else{showError('Erro '+coinResp.status+' ao carregar token.');}
      return;
    }
    var coinData=await coinResp.json();
    if(!coinData||coinData.error||!coinData.market_data){showError('Token <strong>'+_coinId+'</strong> não encontrado.');return;}
    var chartPts=[];
    try{var chartData=await chartResp.json();chartPts=chartData.prices||[];}catch(ec){}
    renderPage(coinData,chartPts);
  }catch(e){
    console.error('init error:',e);
    showError('Erro ao carregar dados. Verifique sua conexão e tente novamente.');
  }
}

fetchTicker();
setTimeout(init,80);
</script>
