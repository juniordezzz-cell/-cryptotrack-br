<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title id="page-title">Token — MundoDeFi</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#07080d;--bg2:#0d0e16;--bg3:#13141f;--bg4:#191a27;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.1);
  --gold:#f0a500;--gold2:rgba(240,165,0,0.12);--gold3:rgba(240,165,0,0.06);
  --green:#00d68f;--green2:rgba(0,214,143,0.12);
  --red:#ff4d6a;--red2:rgba(255,77,106,0.12);
  --blue:#4d9fff;--purple:#a855f7;--cyan:#00e5ff;
  --text:#eeeef8;--muted:#4a4c60;--muted2:#888aa8;
  --font:'DM Sans',sans-serif;--display:'Syne',sans-serif;--mono:'JetBrains Mono',monospace;
  --r:8px;--rl:12px;--rxl:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;overflow-x:hidden}

/* NAV */
nav{position:sticky;top:0;z-index:300;background:rgba(7,8,13,0.97);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.nav-top{display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;height:56px;max-width:1400px;margin:0 auto;gap:12px}
.nav-logo{display:flex;align-items:center;gap:9px;text-decoration:none;flex-shrink:0}
.nav-logo-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--gold),#ff8c00);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:13px;font-weight:800;color:#000}
.nav-logo-text{font-family:var(--display);font-size:14px;font-weight:800;letter-spacing:-.02em}
.nav-logo-text span{color:var(--gold)}
.nav-links{display:flex;align-items:center;gap:2px;flex:1;justify-content:center}
.nav-link{padding:5px 11px;border-radius:var(--r);font-size:12px;font-weight:500;color:var(--muted2);text-decoration:none;transition:all .15s;white-space:nowrap}
.nav-link:hover{color:var(--text);background:var(--bg3)}
.nav-right{display:flex;align-items:center;gap:8px;flex-shrink:0}

/* TOKEN SEARCH IN NAV */
.nav-token-search{position:relative;flex-shrink:0}
.nav-token-input{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);padding:6px 12px 6px 32px;font-size:12px;color:var(--text);font-family:var(--font);width:220px;outline:none;transition:all .2s}
.nav-token-input:focus{border-color:var(--gold);width:260px}
.nav-token-input::placeholder{color:var(--muted)}
.nav-search-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;pointer-events:none;color:var(--muted)}
.nav-token-dd{position:absolute;top:calc(100% + 6px);right:0;width:320px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--rl);box-shadow:0 16px 48px rgba(0,0,0,.6);z-index:400;display:none;max-height:380px;overflow-y:auto}
.nav-token-dd.open{display:block}
.ntdd-item{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;transition:background .12s;text-decoration:none;color:var(--text)}
.ntdd-item:hover{background:var(--bg3)}
.ntdd-ico{width:28px;height:28px;border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--bg3)}
.ntdd-ico-txt{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.ntdd-name{font-size:12px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ntdd-sym{font-size:10px;color:var(--muted2);font-family:var(--mono)}
.ntdd-price{font-size:11px;font-family:var(--mono);color:var(--muted2);text-align:right;flex-shrink:0}
.ntdd-empty{padding:1rem;text-align:center;font-size:12px;color:var(--muted2)}

.nbtn{padding:6px 14px;border-radius:var(--r);font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font);transition:all .15s;text-decoration:none;display:inline-flex;align-items:center;gap:5px;letter-spacing:-.01em;white-space:nowrap}
.nbtn-ghost{background:transparent;border:1px solid var(--border2);color:var(--muted2)}
.nbtn-ghost:hover{color:var(--text)}
.nbtn-pro{background:linear-gradient(135deg,var(--gold),#e09000);border:none;color:#000;font-family:var(--display)}
.nbtn-pro:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(240,165,0,.3)}

/* TICKER */
.ticker-strip{background:var(--bg2);border-bottom:1px solid var(--border);height:32px;overflow:hidden;position:relative}
.ticker-strip::before,.ticker-strip::after{content:'';position:absolute;top:0;bottom:0;width:50px;z-index:2;pointer-events:none}
.ticker-strip::before{left:0;background:linear-gradient(to right,var(--bg2),transparent)}
.ticker-strip::after{right:0;background:linear-gradient(to left,var(--bg2),transparent)}
.ticker-track{display:flex;align-items:center;height:100%;white-space:nowrap;animation:tickScroll 45s linear infinite}
.ticker-track.loading{animation-play-state:paused}
.ticker-track:hover{animation-play-state:paused}
@keyframes tickScroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.t-skel{display:inline-block;width:44px;height:10px;border-radius:3px;background:linear-gradient(90deg,var(--bg3) 25%,var(--bg4) 50%,var(--bg3) 75%);background-size:200% 100%;animation:skelShim 1.4s infinite}
@keyframes skelShim{0%{background-position:200% 0}100%{background-position:-200% 0}}
.t-item{display:inline-flex;align-items:center;gap:5px;padding:0 16px;height:100%;border-right:1px solid var(--border);font-size:11px}
.t-sym{font-family:var(--mono);font-weight:600;font-size:10px}
.t-price{font-family:var(--mono);font-size:10px;color:var(--muted2)}
.t-chg{font-family:var(--mono);font-size:10px;font-weight:600}
.t-chg.up{color:var(--green)}.t-chg.dn{color:var(--red)}.t-chg.nt{color:var(--muted2)}

/* BREADCRUMB */
.breadcrumb{max-width:1400px;margin:0 auto;padding:.7rem 1.5rem;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted2)}
.breadcrumb a{color:var(--muted2);text-decoration:none}
.breadcrumb a:hover{color:var(--text)}
.bc-sep{opacity:.35}
.bc-cur{color:var(--text);font-weight:500}

/* LAYOUT */
.token-wrap{max-width:1400px;margin:0 auto;padding:0 1.5rem 4rem}

/* TOKEN HERO */
.token-hero{padding:.5rem 0 1.2rem;border-bottom:1px solid var(--border);margin-bottom:1.2rem}
.token-hero-top{display:flex;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.token-logo{width:52px;height:52px;border-radius:50%;border:2px solid var(--border2);background:var(--bg3);flex-shrink:0;object-fit:cover}
.token-id-col{flex:1;min-width:200px}
.token-name-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:.35rem}
.token-name{font-family:var(--display);font-size:1.5rem;font-weight:800;letter-spacing:-.025em}
.token-symbol{font-family:var(--mono);font-size:12px;color:var(--muted2);background:var(--bg3);border:1px solid var(--border);padding:2px 9px;border-radius:99px}
.token-rank{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--muted2);background:var(--bg3);border:1px solid var(--border);padding:2px 8px;border-radius:99px}
.token-tags{display:flex;gap:5px;flex-wrap:wrap}
.token-tag{font-size:9px;font-weight:700;padding:2px 9px;border-radius:99px;border:1px solid var(--border);color:var(--muted2);background:var(--bg3);text-transform:uppercase;letter-spacing:.06em;cursor:pointer;transition:all .15s}
.token-tag:hover{border-color:var(--gold);color:var(--gold)}
.token-price-col{text-align:right;margin-left:auto}
.token-price-usd{font-family:var(--mono);font-size:2.2rem;font-weight:700;letter-spacing:-.04em;line-height:1}
.token-chg-row{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:.3rem}
.chg-badge{font-family:var(--mono);font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}
.chg-badge.up{background:var(--green2);color:var(--green)}
.chg-badge.dn{background:var(--red2);color:var(--red)}
.token-sub-prices{display:flex;gap:10px;margin-top:.35rem;justify-content:flex-end;flex-wrap:wrap}
.sub-price{font-size:11px;color:var(--muted2);font-family:var(--mono)}
.sub-price span{color:var(--text);font-weight:500}

/* CHANGE GRID */
.chg-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:1.2rem}
.chg-cell{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:.6rem .8rem;text-align:center}
.chg-cell-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:.3rem}
.chg-cell-val{font-family:var(--mono);font-size:13px;font-weight:700}
.chg-cell-val.up{color:var(--green)}.chg-cell-val.dn{color:var(--red)}.chg-cell-val.nt{color:var(--muted2)}

/* TABS */
.tabs-row{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:1.2rem;overflow-x:auto}
.tab-btn{padding:8px 16px;font-size:12px;font-weight:600;color:var(--muted2);background:transparent;border:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;white-space:nowrap;font-family:var(--font)}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--gold);border-bottom-color:var(--gold)}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* MAIN GRID */
.main-grid{display:grid;grid-template-columns:1fr 320px;gap:14px;align-items:start}
@media(max-width:1024px){.main-grid{grid-template-columns:1fr}}

/* CARDS */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;margin-bottom:12px}
.card:last-child{margin-bottom:0}
.card-hdr{padding:.8rem 1.1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card-ttl{font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:-.01em;text-transform:uppercase;color:var(--muted);letter-spacing:.08em}

/* TRADINGVIEW */
.tv-wrap{height:480px;background:#0d0e16}
.tv-wrap iframe{width:100%;height:100%;border:none}

/* CHART (fallback) */
.chart-wrap{height:300px;padding:1rem;position:relative}
.chart-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:6px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--gold);animation:dp 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes dp{0%,80%,100%{opacity:.2}40%{opacity:1}}
.period-btns{display:flex;gap:3px}
.period-btn{padding:3px 10px;border-radius:99px;border:1px solid var(--border);font-size:10px;font-weight:600;color:var(--muted2);cursor:pointer;background:transparent;transition:all .15s;font-family:var(--mono)}
.period-btn:hover{color:var(--text)}
.period-btn.active{background:var(--gold2);border-color:rgba(240,165,0,.3);color:var(--gold)}

/* FUND GRID */
.fund-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border)}
@media(max-width:640px){.fund-grid{grid-template-columns:1fr 1fr}}
.fund-item{background:var(--bg2);padding:.8rem 1rem}
.fund-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:.3rem}
.fund-val{font-family:var(--mono);font-size:13px;font-weight:600}
.fund-sub{font-size:10px;color:var(--muted2);margin-top:2px}

/* AI ANALYSIS */
.ai-wrap{padding:1.1rem}
.ai-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem;flex-wrap:wrap;gap:8px}
.ai-badge{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,rgba(168,85,247,.15),rgba(77,159,255,.1));border:1px solid rgba(168,85,247,.25);border-radius:99px;padding:4px 12px;font-size:11px;font-weight:600;color:#c084fc}
.ai-lang-toggle{font-size:11px;color:var(--gold);cursor:pointer;background:none;border:none;font-family:var(--font);padding:0}
.ai-lang-toggle:hover{text-decoration:underline}
.ai-body{font-size:12px;color:var(--muted2);line-height:1.8;font-weight:300}
.ai-body strong{color:var(--text);font-weight:600}
.ai-loading{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted2);padding:.5rem 0}
.ai-loading-dots{display:flex;gap:4px}
.ai-skel{height:12px;border-radius:3px;margin-bottom:8px;background:linear-gradient(90deg,var(--bg3) 25%,var(--bg4) 50%,var(--bg3) 75%);background-size:200% 100%;animation:skelShim 1.4s infinite}
.ai-signals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:.9rem}
.ai-signal{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:.6rem .7rem;text-align:center}
.ai-signal-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.25rem}
.ai-signal-val{font-size:12px;font-weight:700;font-family:var(--mono)}
.sentiment-row{display:flex;align-items:center;gap:10px;margin-top:.9rem;padding:.8rem;background:var(--bg3);border-radius:var(--r);border:1px solid var(--border)}
.sentiment-bull{flex:1;text-align:center}
.sentiment-bear{flex:1;text-align:center}
.sentiment-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.3rem}
.sentiment-pct{font-family:var(--mono);font-size:16px;font-weight:700}
.sentiment-bar-wrap{height:6px;background:var(--bg4);border-radius:99px;overflow:hidden;flex:2;position:relative}
.sentiment-bar-bull{height:100%;border-radius:99px;transition:width .6s ease}

/* MARKETS TABLE */
.markets-table{width:100%;border-collapse:collapse;font-size:12px}
.markets-table th{padding:.6rem .9rem;text-align:left;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap}
.markets-table td{padding:.7rem .9rem;border-bottom:1px solid var(--border);vertical-align:middle}
.markets-table tr:last-child td{border-bottom:none}
.markets-table tr:hover td{background:var(--bg3)}
.ex-logo{width:20px;height:20px;border-radius:4px;object-fit:cover;margin-right:6px;vertical-align:middle;background:var(--bg3)}
.ex-name{font-weight:600;vertical-align:middle}
.pair-badge{font-family:var(--mono);font-size:11px;background:var(--bg3);padding:2px 7px;border-radius:4px;border:1px solid var(--border)}
.buy-btn{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:6px;background:var(--green2);border:1px solid rgba(0,214,143,.2);color:var(--green);font-size:10px;font-weight:700;text-decoration:none;transition:all .15s;white-space:nowrap}
.buy-btn:hover{background:rgba(0,214,143,.2)}

/* HOLDERS */
.holders-list{padding:.3rem 0}
.holder-item{display:flex;align-items:center;gap:10px;padding:.65rem 1.1rem;border-bottom:1px solid var(--border);transition:background .12s}
.holder-item:last-child{border-bottom:none}
.holder-item:hover{background:var(--bg3)}
.holder-rank{font-family:var(--mono);font-size:10px;color:var(--muted);width:18px;flex-shrink:0;text-align:right}
.holder-addr{font-family:var(--mono);font-size:11px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.holder-addr a{color:var(--blue);text-decoration:none}
.holder-addr a:hover{text-decoration:underline}
.holder-pct{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--gold);flex-shrink:0;width:50px;text-align:right}
.holder-bar-wrap{width:80px;height:4px;background:var(--bg4);border-radius:99px;overflow:hidden;flex-shrink:0}
.holder-bar{height:100%;border-radius:99px;background:var(--gold)}

/* TOKEN UNLOCKS */
.unlock-list{padding:.5rem 1.1rem 1rem}
.unlock-item{display:flex;align-items:center;gap:10px;padding:.55rem 0;border-bottom:1px solid var(--border)}
.unlock-item:last-child{border-bottom:none}
.unlock-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.unlock-label{font-size:12px;flex:1}
.unlock-date{font-size:10px;color:var(--muted2);font-family:var(--mono)}
.unlock-amount{font-family:var(--mono);font-size:11px;font-weight:600;text-align:right}
.unlock-pct{font-size:10px;color:var(--muted2);text-align:right}

/* INVESTORS */
.investors-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:1rem}
.investor-item{display:flex;align-items:center;gap:8px;padding:.6rem .8rem;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r)}
.investor-ico{width:30px;height:30px;border-radius:8px;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.investor-name{font-size:11px;font-weight:600}
.investor-type{font-size:9px;color:var(--muted2);text-transform:uppercase;letter-spacing:.06em}

/* ABOUT */
.about-body{padding:1rem 1.1rem}
.about-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1rem}
.about-item{}
.about-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:.25rem}
.about-val{font-size:12px;font-weight:500}
.about-desc{font-size:12px;color:var(--muted2);line-height:1.75;font-weight:300}
.about-desc.collapsed{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.read-more{margin-top:.5rem;font-size:11px;color:var(--gold);cursor:pointer;background:none;border:none;padding:0;font-family:var(--font)}
.read-more:hover{text-decoration:underline}

/* SIDEBAR */
.sidebar{display:flex;flex-direction:column;gap:10px}

/* LINKS */
.link-list{padding:.5rem .7rem}
.link-item{display:flex;align-items:center;gap:8px;padding:.55rem .5rem;border-radius:var(--r);text-decoration:none;color:var(--muted2);font-size:12px;transition:all .15s}
.link-item:hover{background:var(--bg3);color:var(--text)}
.link-ico{width:24px;height:24px;border-radius:6px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.link-name{flex:1;font-weight:500}
.link-arr{font-size:10px;opacity:.4}

/* CALC */
.calc-link{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1rem;text-decoration:none;color:var(--text);transition:background .15s}
.calc-link:hover{background:var(--bg3)}
.calc-ico{width:32px;height:32px;border-radius:8px;background:var(--gold2);border:1px solid rgba(240,165,0,.2);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.calc-ttl{font-size:12px;font-weight:600}
.calc-sub{font-size:10px;color:var(--muted2)}

/* SUPPLY BAR */
.supply-bar-wrap{padding:1rem 1.1rem}
.supply-bar-lbl{display:flex;justify-content:space-between;font-size:10px;color:var(--muted2);margin-bottom:.4rem}
.supply-bar-bg{height:6px;background:var(--bg4);border-radius:99px;overflow:hidden}
.supply-bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--green));transition:width .8s ease}

/* ERROR */
.error-state{max-width:500px;margin:5rem auto;text-align:center;padding:2rem}
.error-icon{font-size:2.5rem;margin-bottom:1rem}
.error-ttl{font-family:var(--display);font-size:1.2rem;font-weight:700;margin-bottom:.5rem}
.error-sub{font-size:12px;color:var(--muted2);line-height:1.7;margin-bottom:1.5rem}
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 20px;border-radius:99px;background:var(--bg3);border:1px solid var(--border2);color:var(--text);text-decoration:none;font-size:12px;font-weight:600;transition:all .15s}
.back-btn:hover{border-color:var(--gold);color:var(--gold)}

/* SKELETON */
.skel{border-radius:var(--r);background:linear-gradient(90deg,var(--bg3) 25%,var(--bg4) 50%,var(--bg3) 75%);background-size:200% 100%;animation:skelShim 1.4s infinite}

/* FOOTER */
footer{background:var(--bg2);border-top:1px solid var(--border);padding:1.2rem;text-align:center}
.footer-copy{font-size:11px;color:var(--muted);font-weight:300}

/* RESPONSIVE */
@media(max-width:768px){
  .nav-links{display:none}
  .chg-grid{grid-template-columns:repeat(3,1fr)}
  .token-price-col{width:100%}

<script>
// ══ UTILS ══
function fmtP(v){
  if(v===null||v===undefined||isNaN(v))return'—';
  if(v>=1000)return'$'+v.toLocaleString('pt-BR',{maximumFractionDigits:0});
  if(v>=1)return'$'+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:4});
  if(v>=0.01)return'$'+v.toLocaleString('pt-BR',{minimumFractionDigits:4,maximumFractionDigits:6});
  return'$'+v.toLocaleString('pt-BR',{minimumFractionDigits:6,maximumFractionDigits:8});
}
function fmtBRL(v,r){if(!v||!r)return'—';var b=v*r;if(b>=1e9)return'R$'+(b/1e9).toFixed(2)+'B';if(b>=1e6)return'R$'+(b/1e6).toFixed(2)+'M';if(b>=1000)return'R$'+b.toLocaleString('pt-BR',{maximumFractionDigits:0});return'R$'+b.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:4});}
function fmtC(v,suf){if(v===null||v===undefined)return'—';return(v>=0?'+':'')+v.toFixed(2)+'%'+(suf||'');}
function fmtB(v){if(!v&&v!==0)return'—';if(v>=1e12)return'$'+(v/1e12).toFixed(2)+'T';if(v>=1e9)return'$'+(v/1e9).toFixed(2)+'B';if(v>=1e6)return'$'+(v/1e6).toFixed(2)+'M';return'$'+v.toLocaleString('pt-BR',{maximumFractionDigits:0});}
function fmtN(v){if(!v&&v!==0)return'—';return v.toLocaleString('pt-BR',{maximumFractionDigits:0});}
function clr(v){return v===null||v===undefined?'nt':v>=0?'up':'dn';}
function shortAddr(a){return a?a.slice(0,6)+'…'+a.slice(-4):'';}

// ══ STATE ══
var _coinId='';var _data=null;var _usdBRL=null;var _btcPrice=null;
var _chart=null;var _period='7';var _aiPT='';var _aiEN='';var _aiLang='pt';
var _searchTO=null;var _top500=[];

// ══ GET ID ══

// ══ TICKER ══
var _FB={bitcoin:{usd:97000,usd_24h_change:0},ethereum:{usd:2600,usd_24h_change:0},solana:{usd:165,usd_24h_change:0},binancecoin:{usd:620,usd_24h_change:0},ripple:{usd:2.1,usd_24h_change:0}};

// ══ CHART ══
function drawChart(pts){
  var canvas=document.getElementById('fallback-chart');if(!canvas)return;
  if(_chart){_chart.destroy();_chart=null;}
  var labels=pts.map(function(p){var d=new Date(p[0]);if(_period==='1')return d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});if(_period==='7'||_period==='30')return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});return d.toLocaleDateString('pt-BR',{month:'short',year:'2-digit'});});
  var values=pts.map(function(p){return p[1];});
  var isUp=values[values.length-1]>=values[0];
  var lc=isUp?'#00d68f':'#ff4d6a';
  var ctx=canvas.getContext('2d');
  var grad=ctx.createLinearGradient(0,0,0,260);grad.addColorStop(0,isUp?'rgba(0,214,143,.15)':'rgba(255,77,106,.15)');grad.addColorStop(1,'rgba(0,0,0,0)');
  var step=Math.max(1,Math.floor(labels.length/8));
  _chart=new Chart(ctx,{type:'line',data:{labels:labels.map(function(l,i){return i%step===0?l:'';}),datasets:[{data:values,borderColor:lc,borderWidth:1.8,backgroundColor:grad,fill:true,tension:0.3,pointRadius:0,pointHoverRadius:5,pointHoverBackgroundColor:lc,pointHoverBorderColor:'#fff',pointHoverBorderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{backgroundColor:'rgba(13,14,22,.97)',borderColor:'rgba(255,255,255,.08)',borderWidth:1,titleColor:'#888aa8',bodyColor:'#eeeef8',bodyFont:{family:'JetBrains Mono,monospace',size:13,weight:'600'},titleFont:{family:'DM Sans,sans-serif',size:10},padding:10,callbacks:{title:function(i){return labels[i[0].dataIndex]||'';},label:function(i){return fmtP(i.parsed.y);}}}},
      scales:{x:{grid:{color:'rgba(255,255,255,.03)'},ticks:{color:'#4a4c60',font:{size:9,family:'JetBrains Mono,monospace'},maxRotation:0}},y:{position:'right',grid:{color:'rgba(255,255,255,.03)'},ticks:{color:'#4a4c60',font:{size:9,family:'JetBrains Mono,monospace'},callback:function(v){return fmtP(v);}}}}}});
}
function fetchChart(id,days){
  var wrap=document.getElementById('chart-fallback-wrap');if(!wrap)return;

    .then(function(r){return r.json();}).then(function(d){if(ld)ld.style.display='none';if(d.prices&&d.prices.length)drawChart(d.prices);}).catch(function(){if(ld)ld.style.display='none';});
}

// ══ AI ANALYSIS ══
async function runAI(coinName,symbol,price,chg24,chg7,mcap,vol){
  var wrap=document.getElementById('ai-wrap');if(!wrap)return;
  wrap.innerHTML='<div class="ai-header"><span class="ai-badge">🤖 Análise IA — Gerando...</span></div><div class="ai-loading"><div class="ai-loading-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div><span style="font-size:12px;color:var(--muted2)">Analisando dados do mercado...</span></div><div class="ai-skel" style="width:100%;height:11px"></div><div class="ai-skel" style="width:85%;height:11px"></div><div class="ai-skel" style="width:90%;height:11px"></div>';
  var prompt='Você é um analista técnico de criptomoedas sênior. Faça uma análise técnica e fundamentalista COMPLETA e DETALHADA do token abaixo. Responda em português brasileiro.\n\nToken: '+coinName+' ('+symbol+')\nPreço atual: '+price+'\nVariação 24h: '+chg24+'\nVariação 7d: '+chg7+'\nMarket Cap: '+mcap+'\nVolume 24h: '+vol+'\n\nEstruture sua análise com:\n1. **Cenário atual**: contexto macro e posição do token no mercado\n2. **Análise técnica**: tendência, suportes e resistências prováveis, momentum\n3. **Fundamentos**: avaliação do market cap, volume relativo, força do projeto\n4. **Sinais**: Bull ou Bear? Justifique\n5. **Atenção**: riscos específicos a este token agora\n\nSeja direto, use dados concretos, escreva como se estivesse ensinando a um investidor intermediário. Máximo 400 palavras.';
  try{
    var resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:800,messages:[{role:'user',content:prompt}]})});
    var json=await resp.json();
    var text=(json.content&&json.content[0]&&json.content[0].text)?json.content[0].text:'Análise indisponível no momento.';
    _aiPT=text;
    // Get English version
    var resp2=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:800,messages:[{role:'user',content:'Translate the following crypto analysis to English, keeping the same structure and data:\n\n'+text}]})});
    var json2=await resp2.json();
    _aiEN=(json2.content&&json2.content[0]&&json2.content[0].text)?json2.content[0].text:text;
    renderAI(_aiPT);
  }catch(e){
    if(wrap)wrap.innerHTML='<div class="ai-body" style="padding:1rem">Análise temporariamente indisponível.</div>';
  }
}
function renderAI(text){
  var wrap=document.getElementById('ai-wrap');if(!wrap)return;
  var formatted=text.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
  wrap.innerHTML='<div class="ai-header"><span class="ai-badge">🤖 Análise IA — MundoDeFi</span><button class="ai-lang-toggle" onclick="toggleAILang()">'+(_aiLang==='pt'?'Ver em inglês':'Ver em português')+'</button></div><div class="ai-body">'+formatted+'</div>';
}
function toggleAILang(){
  _aiLang=_aiLang==='pt'?'en':'pt';
  renderAI(_aiLang==='pt'?_aiPT:_aiEN);
}

// ══ TRANSLATE ══
async function translateText(text){
  if(!text)return'';
  var clean=text.replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').substring(0,900);
  try{
    var r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:600,messages:[{role:'user',content:'Traduza para português brasileiro de forma natural. Responda APENAS com a tradução:\n\n'+clean}]})});
    var j=await r.json();
    return(j.content&&j.content[0]&&j.content[0].text)?j.content[0].text.trim():clean;
  }catch(e){return clean;}
}

function getLayerInfo(cats,id){
  var known={'bitcoin':'<strong>Bitcoin (BTC)</strong> é a primeira criptomoeda do mundo, criada em 2009 por Satoshi Nakamoto. Funciona como <strong>reserva de valor descentralizada</strong> — o "ouro digital". Não é programável como Ethereum, mas é a rede mais segura e descentralizada existente. É <strong>Layer 1 nativo</strong>, sem smart contracts avançados.','ethereum':'<strong>Ethereum (ETH)</strong> é a principal plataforma de <strong>smart contracts</strong> do mundo — Layer 1. É a base de 90%+ do ecossistema DeFi, NFTs e dApps. Em 2022 migrou para Proof of Stake (The Merge), tornando-se deflacionário em períodos de alta atividade. Toda a economia Web3 roda em cima de Ethereum.','solana':'<strong>Solana (SOL)</strong> é uma blockchain Layer 1 de alta performance — 65.000 TPS teórico, fees de frações de centavo. Usa Proof of History (PoH) + PoS. Rival direta de Ethereum para DeFi e NFTs. Cresceu muito com o ecossistema de meme coins em 2024.','binancecoin':'<strong>BNB</strong> é o token nativo da Binance e da BNB Chain (Layer 1). Usado para pagar taxas na maior exchange do mundo e como gas na BNB Chain. Tem queimas trimestrais que reduzem o supply.','ripple':'<strong>XRP</strong> é o token da rede Ripple, focado em <strong>pagamentos internacionais</strong> para instituições financeiras. Extremamente rápido (3-5 segundos) e barato. Centralizado comparado ao Bitcoin.'};
  if(known[id])return known[id];
  var isL1=cats.some(function(c){return c.toLowerCase().indexOf('layer 1')>=0;});

var _descExp=false;
function toggleDesc(){
  _descExp=!_descExp;
  var el=document.getElementById('about-desc');
  var btn=document.getElementById('read-more-btn');
  if(el)el.classList.toggle('collapsed',!_descExp);
  if(btn)btn.textContent=_descExp?'Ler menos ↑':'Ler mais ↓';
}

// ══ SHOW ERROR ══
function showError(msg){
  document.getElementById('app').innerHTML='<div class="error-state"><div class="error-icon">🔍</div><div class="error-ttl">Token não encontrado</div><p class="error-sub">'+msg+'</p><a href="index.html" class="back-btn">← Voltar para o início</a></div>';
}

// ══ INIT ══
async function init(){
  _coinId=getCoinId();
  if(!_coinId){showError('Nenhum token especificado. Use <strong>token.html?id=bitcoin</strong>');return;}
  try{
    var [coinResp,chartResp]=await Promise.all([
      fetch('https://api.coingecko.com/api/v3/coins/'+_coinId+'?localization=false&tickers=true&market_data=true&community_data=true&developer_data=true&sparkline=false'),
      fetch('https://api.coingecko.com/api/v3/coins/'+_coinId+'/market_chart?vs_currency=usd&days=7')
    ]);
    if(!coinResp.ok){showError('Token <strong>'+_coinId+'</strong> não encontrado. Verifique o ID.');return;}
    var coinData=await coinResp.json();
    var chartData=await chartResp.json();
    _data=coinData;
    await renderPage(coinData,chartData.prices||[]);
  }catch(e){showError('Erro ao carregar dados. Verifique sua conexão.');}
}

fetchTicker();
fetchTop500();
init();
