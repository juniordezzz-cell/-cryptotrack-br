<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title id="page-title">Token — MundoDeFi</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#07080d;--bg2:#0d0e16;--bg3:#13141f;--bg4:#191a27;--bg5:#1e2030;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.1);--border3:rgba(255,255,255,0.15);
  --gold:#f0a500;--gold2:rgba(240,165,0,0.12);--gold3:rgba(240,165,0,0.06);--gold4:rgba(240,165,0,0.25);
  --green:#00d68f;--green2:rgba(0,214,143,0.12);--green3:#00b87a;
  --red:#ff4d6a;--red2:rgba(255,77,106,0.12);--red3:#e6003d;
  --blue:#4d9fff;--blue2:rgba(77,159,255,0.12);--purple:#a855f7;--cyan:#00e5ff;
  --text:#eeeef8;--muted:#4a4c60;--muted2:#888aa8;--muted3:#6b6e8a;
  --font:'DM Sans',sans-serif;--display:'Syne',sans-serif;--mono:'JetBrains Mono',monospace;
  --r:6px;--rl:10px;--rxl:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;overflow-x:hidden}

/* ── NAV ── */
nav{position:sticky;top:0;z-index:300;background:rgba(7,8,13,0.98);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.nav-top{display:flex;align-items:center;justify-content:space-between;padding:0 1.2rem;height:52px;max-width:1500px;margin:0 auto;gap:10px}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;flex-shrink:0}
.nav-logo-mark{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--gold),#ff8c00);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:12px;font-weight:800;color:#000}
.nav-logo-text{font-family:var(--display);font-size:13px;font-weight:800;letter-spacing:-.02em}
.nav-logo-text span{color:var(--gold)}
.nav-links{display:flex;align-items:center;gap:1px;flex:1;justify-content:center}
.nav-link{padding:5px 10px;border-radius:var(--r);font-size:11.5px;font-weight:500;color:var(--muted2);text-decoration:none;transition:all .15s;white-space:nowrap}
.nav-link:hover{color:var(--text);background:var(--bg3)}
.nav-right{display:flex;align-items:center;gap:6px;flex-shrink:0}

/* search */
.nav-token-search{position:relative;flex-shrink:0}
.nav-token-input{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);padding:6px 12px 6px 30px;font-size:12px;color:var(--text);font-family:var(--font);width:240px;outline:none;transition:all .2s}
.nav-token-input:focus{border-color:var(--gold);width:300px}
.nav-token-input::placeholder{color:var(--muted)}
.nav-search-ico{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:11px;pointer-events:none;color:var(--muted)}
.nav-token-dd{position:absolute;top:calc(100% + 6px);right:0;width:340px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--rl);box-shadow:0 20px 60px rgba(0,0,0,.7);z-index:400;display:none;max-height:420px;overflow-y:auto}
.nav-token-dd.open{display:block}
.ntdd-hdr{padding:8px 12px 4px;font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.ntdd-item{display:flex;align-items:center;gap:9px;padding:8px 12px;cursor:pointer;transition:background .12s;text-decoration:none;color:var(--text)}
.ntdd-item:hover{background:var(--bg3)}
.ntdd-ico{width:26px;height:26px;border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--bg3)}
.ntdd-name{font-size:12px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ntdd-sym{font-size:10px;color:var(--muted2);font-family:var(--mono)}
.ntdd-price{font-size:11px;font-family:var(--mono);color:var(--muted2);text-align:right;flex-shrink:0}
.ntdd-chg{font-size:10px;font-family:var(--mono);font-weight:600;text-align:right;min-width:50px}
.ntdd-empty{padding:1.2rem;text-align:center;font-size:12px;color:var(--muted2)}

.nbtn{padding:5px 13px;border-radius:var(--r);font-size:11.5px;font-weight:700;cursor:pointer;font-family:var(--font);transition:all .15s;text-decoration:none;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.nbtn-ghost{background:transparent;border:1px solid var(--border2);color:var(--muted2)}
.nbtn-ghost:hover{color:var(--text);border-color:var(--border3)}
.nbtn-pro{background:linear-gradient(135deg,var(--gold),#e09000);border:none;color:#000;font-family:var(--display)}
.nbtn-pro:hover{opacity:.9;transform:translateY(-1px)}

/* ── TICKER ── */
.ticker-strip{background:var(--bg2);border-bottom:1px solid var(--border);height:30px;overflow:hidden;position:relative}
.ticker-strip::before,.ticker-strip::after{content:'';position:absolute;top:0;bottom:0;width:40px;z-index:2;pointer-events:none}
.ticker-strip::before{left:0;background:linear-gradient(to right,var(--bg2),transparent)}
.ticker-strip::after{right:0;background:linear-gradient(to left,var(--bg2),transparent)}
.ticker-track{display:flex;align-items:center;height:100%;white-space:nowrap;animation:tickScroll 50s linear infinite}
.ticker-track:hover{animation-play-state:paused}
@keyframes tickScroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.t-item{display:inline-flex;align-items:center;gap:5px;padding:0 14px;height:100%;border-right:1px solid var(--border);font-size:10.5px}
.t-sym{font-family:var(--mono);font-weight:600;font-size:10px}
.t-price{font-family:var(--mono);font-size:10px;color:var(--muted2)}
.t-chg{font-family:var(--mono);font-size:10px;font-weight:600}
.t-chg.up{color:var(--green)}.t-chg.dn{color:var(--red)}.t-chg.nt{color:var(--muted2)}

/* ── HERO SECTION ── */
.token-hero-wrap{max-width:1500px;margin:0 auto;padding:1rem 1.2rem .6rem}
.breadcrumb{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted2);margin-bottom:.9rem}
.breadcrumb a{color:var(--muted2);text-decoration:none}.breadcrumb a:hover{color:var(--text)}
.bc-sep{opacity:.3}.bc-cur{color:var(--text);font-weight:500}

/* hero top row */
.hero-top{display:flex;align-items:flex-start;gap:1.2rem;flex-wrap:wrap}
.hero-left{flex:1;min-width:280px}
.hero-logo-row{display:flex;align-items:center;gap:10px;margin-bottom:.6rem}
.hero-logo{width:44px;height:44px;border-radius:50%;border:2px solid var(--border2);background:var(--bg3);object-fit:cover;flex-shrink:0}
.hero-title-col{}
.hero-name{font-family:var(--display);font-size:1.6rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.hero-meta{display:flex;align-items:center;gap:6px;margin-top:.3rem;flex-wrap:wrap}
.hero-sym{font-family:var(--mono);font-size:11px;color:var(--muted2);background:var(--bg3);border:1px solid var(--border);padding:2px 8px;border-radius:99px}
.hero-rank{font-family:var(--mono);font-size:11px;color:var(--gold);background:var(--gold3);border:1px solid var(--gold2);padding:2px 8px;border-radius:99px;font-weight:700}
.hero-tag{font-size:9px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid var(--border);color:var(--muted2);background:var(--bg3);text-transform:uppercase;letter-spacing:.06em;cursor:pointer;transition:all .15s}
.hero-tag:hover{border-color:var(--blue);color:var(--blue)}
.hero-tag.l1{border-color:rgba(0,229,255,.25);color:var(--cyan);background:rgba(0,229,255,.06)}
.hero-tag.l2{border-color:rgba(168,85,247,.25);color:var(--purple);background:rgba(168,85,247,.06)}
.hero-tag.defi{border-color:rgba(0,214,143,.25);color:var(--green);background:rgba(0,214,143,.06)}

.hero-right{text-align:right;flex-shrink:0}
.hero-price{font-family:var(--mono);font-size:2.4rem;font-weight:700;letter-spacing:-.05em;line-height:1}
.hero-chg-row{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:.3rem;flex-wrap:wrap}
.chg-badge{font-family:var(--mono);font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;display:inline-flex;align-items:center;gap:3px}
.chg-badge.up{background:var(--green2);color:var(--green)}
.chg-badge.dn{background:var(--red2);color:var(--red)}
.chg-badge.nt{background:var(--bg3);color:var(--muted2)}
.hero-sub-row{display:flex;gap:10px;justify-content:flex-end;margin-top:.3rem;flex-wrap:wrap}
.sub-price{font-size:11px;color:var(--muted2);font-family:var(--mono)}
.sub-price span{color:var(--muted3)}

/* ── PRICE CHANGE BAR ── */
.chg-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:.8rem;margin-bottom:.6rem}
.chg-cell{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:.55rem .7rem;text-align:center;transition:all .2s}
.chg-cell:hover{border-color:var(--border2);background:var(--bg3)}
.chg-cell-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:.25rem}
.chg-cell-val{font-family:var(--mono);font-size:13px;font-weight:700}
.chg-cell-val.up{color:var(--green)}.chg-cell-val.dn{color:var(--red)}.chg-cell-val.nt{color:var(--muted2)}

/* ── QUICK STATS ROW ── */
.quick-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:.8rem}
@media(max-width:900px){.quick-stats{grid-template-columns:repeat(2,1fr)}}
.qs-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:.65rem .9rem}
.qs-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:.25rem;display:flex;align-items:center;gap:4px}
.qs-val{font-family:var(--mono);font-size:13.5px;font-weight:700;color:var(--text)}
.qs-sub{font-size:10px;color:var(--muted2);margin-top:1px;font-family:var(--mono)}
.qs-chg{font-family:var(--mono);font-size:11px;font-weight:700}
.qs-chg.up{color:var(--green)}.qs-chg.dn{color:var(--red)}

/* ── LAYOUT MAIN ── */
.page-body{max-width:1500px;margin:0 auto;padding:0 1.2rem 4rem;display:grid;grid-template-columns:1fr 310px;gap:12px;align-items:start}
@media(max-width:1100px){.page-body{grid-template-columns:1fr}}

/* ── TABS ── */
.tabs-row{display:flex;gap:1px;border-bottom:1px solid var(--border);margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
.tabs-row::-webkit-scrollbar{display:none}
.tab-btn{padding:8px 15px;font-size:12px;font-weight:600;color:var(--muted2);background:transparent;border:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;white-space:nowrap;font-family:var(--font)}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--gold);border-bottom-color:var(--gold)}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* ── CARD ── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;margin-bottom:10px}
.card:last-child{margin-bottom:0}
.card-hdr{padding:.7rem 1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card-ttl{font-family:var(--display);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}

/* ── TRADINGVIEW ── */
.tv-wrap{height:520px;background:var(--bg)}
.tv-wrap iframe{width:100%;height:100%;border:none}

/* ── CHART FALLBACK ── */
.chart-wrap{height:280px;padding:.8rem;position:relative}
.chart-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:5px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--gold);animation:dp 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes dp{0%,80%,100%{opacity:.2}40%{opacity:1}}
.period-btns{display:flex;gap:2px}
.period-btn{padding:3px 9px;border-radius:99px;border:1px solid var(--border);font-size:10px;font-weight:600;color:var(--muted2);cursor:pointer;background:transparent;transition:all .15s;font-family:var(--mono)}
.period-btn:hover{color:var(--text)}
.period-btn.active{background:var(--gold2);border-color:rgba(240,165,0,.3);color:var(--gold)}

/* ── SENTIMENT ── */
.sentiment-wrap{padding:.9rem 1rem}
.sent-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:.6rem}
.sent-bull{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--green);min-width:46px}
.sent-bear{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--red);min-width:46px;text-align:right}
.sent-bar-track{flex:1;height:7px;background:var(--bg4);border-radius:99px;overflow:hidden}
.sent-bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green),#00b87a)}
.sent-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted2)}
.vote-btns{display:flex;gap:6px;margin-top:.8rem}
.vote-btn{flex:1;padding:7px;border-radius:var(--r);border:1px solid var(--border);background:transparent;color:var(--muted2);font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all .15s;display:flex;align-items:center;justify-content:center;gap:5px}
.vote-btn.bull:hover{background:var(--green2);border-color:rgba(0,214,143,.3);color:var(--green)}
.vote-btn.bear:hover{background:var(--red2);border-color:rgba(255,77,106,.3);color:var(--red)}
.vote-btn.active-bull{background:var(--green2);border-color:rgba(0,214,143,.3);color:var(--green)}
.vote-btn.active-bear{background:var(--red2);border-color:rgba(255,77,106,.3);color:var(--red)}

/* ── AI ANALYSIS ── */
.ai-wrap{padding:1rem}
.ai-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem;flex-wrap:wrap;gap:8px}
.ai-badge{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,rgba(168,85,247,.15),rgba(77,159,255,.1));border:1px solid rgba(168,85,247,.25);border-radius:99px;padding:4px 12px;font-size:11px;font-weight:600;color:#c084fc}
.ai-pulse{width:6px;height:6px;border-radius:50%;background:#c084fc;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}
.ai-lang-btn{font-size:11px;color:var(--gold);cursor:pointer;background:none;border:1px solid var(--border);border-radius:99px;font-family:var(--font);padding:3px 10px;transition:all .15s}
.ai-lang-btn:hover{border-color:var(--gold)}
.ai-body{font-size:12.5px;color:var(--muted2);line-height:1.85;font-weight:300}
.ai-body strong{color:var(--text);font-weight:600}
.ai-signals{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:.9rem}
.ai-signal{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:.6rem .7rem;text-align:center}
.ai-signal-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.25rem}
.ai-signal-val{font-size:12px;font-weight:700;font-family:var(--mono)}
.ai-skel{height:11px;border-radius:3px;margin-bottom:7px;background:linear-gradient(90deg,var(--bg3) 25%,var(--bg4) 50%,var(--bg3) 75%);background-size:200% 100%;animation:skelShim 1.4s infinite}
@keyframes skelShim{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── FUND GRID ── */
.fund-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border)}
@media(max-width:640px){.fund-grid{grid-template-columns:1fr 1fr}}
.fund-item{background:var(--bg2);padding:.75rem .9rem;transition:background .15s}
.fund-item:hover{background:var(--bg3)}
.fund-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:.25rem}
.fund-val{font-family:var(--mono);font-size:13px;font-weight:600}
.fund-sub{font-size:10px;color:var(--muted2);margin-top:2px}
.supply-bar-wrap{padding:.75rem 1rem;border-top:1px solid var(--border)}
.supply-bar-lbl{display:flex;justify-content:space-between;font-size:10px;color:var(--muted2);margin-bottom:.4rem}
.supply-bar-bg{height:5px;background:var(--bg4);border-radius:99px;overflow:hidden}
.supply-bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),#ff8c00);transition:width .8s ease}

/* ── MARKETS TABLE ── */
.table-wrap{overflow-x:auto}
.data-table{width:100%;border-collapse:collapse;font-size:12px}
.data-table th{padding:.55rem .8rem;text-align:left;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap}
.data-table td{padding:.65rem .8rem;border-bottom:1px solid var(--border);vertical-align:middle}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:var(--bg3)}
.ex-logo{width:18px;height:18px;border-radius:4px;object-fit:cover;margin-right:5px;vertical-align:middle;background:var(--bg3)}
.ex-name{font-weight:600;vertical-align:middle;color:var(--text)}
.pair-badge{font-family:var(--mono);font-size:11px;background:var(--bg3);padding:2px 7px;border-radius:4px;border:1px solid var(--border)}
.pct-bar{height:3px;background:var(--bg4);border-radius:99px;overflow:hidden;margin-top:3px;width:80px}
.pct-bar-fill{height:100%;background:var(--blue);border-radius:99px}
.buy-btn{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:5px;background:var(--green2);border:1px solid rgba(0,214,143,.2);color:var(--green);font-size:10px;font-weight:700;text-decoration:none;transition:all .15s;white-space:nowrap}
.buy-btn:hover{background:rgba(0,214,143,.2)}
.liq-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
.liq-dot.high{background:var(--green)}.liq-dot.med{background:var(--gold)}.liq-dot.low{background:var(--red)}

/* ── ABOUT / INFO ── */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:1rem}
@media(max-width:640px){.about-grid{grid-template-columns:1fr}}
.about-desc{grid-column:1/-1;font-size:12.5px;color:var(--muted2);line-height:1.8;border:1px solid var(--border);border-radius:var(--r);padding:.9rem;background:var(--bg3)}
.about-desc.collapsed{max-height:120px;overflow:hidden;position:relative}
.about-desc.collapsed::after{content:'';position:absolute;bottom:0;left:0;right:0;height:40px;background:linear-gradient(transparent,var(--bg3))}
.read-more-btn{background:none;border:none;color:var(--gold);cursor:pointer;font-size:11px;font-family:var(--font);padding:.3rem 0;margin-top:.3rem}
.info-row{display:flex;flex-direction:column;gap:8px}
.info-item{display:flex;align-items:center;justify-content:space-between;padding:.5rem .7rem;background:var(--bg3);border-radius:var(--r);border:1px solid var(--border)}
.info-key{font-size:10px;color:var(--muted2);font-weight:500}
.info-val{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--text)}
.links-grid{display:flex;flex-direction:column;gap:5px}
.link-item{display:flex;align-items:center;gap:8px;padding:.5rem .7rem;background:var(--bg3);border-radius:var(--r);border:1px solid var(--border);text-decoration:none;color:var(--text);transition:all .15s}
.link-item:hover{border-color:var(--border2);background:var(--bg4)}
.link-ico{font-size:14px;width:20px;text-align:center}
.link-name{font-size:11px;font-weight:500;flex:1}
.link-arr{font-size:10px;color:var(--muted);margin-left:auto}

/* ── INVESTORS ── */
.investors-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:7px;padding:1rem}
.inv-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:.65rem .8rem;text-align:center;transition:all .2s}
.inv-card:hover{border-color:var(--border2);transform:translateY(-1px)}
.inv-name{font-size:11px;font-weight:600;margin-bottom:.2rem}
.inv-type{font-size:9px;color:var(--muted2);text-transform:uppercase;letter-spacing:.06em}

/* ── HOLDERS ── */

function fmtP(v){
  if(v===null||v===undefined||isNaN(v))return'—';
  if(v>=1000)return'$'+v.toLocaleString('en-US',{maximumFractionDigits:0});
  if(v>=1)return'$'+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:4});
  if(v>=0.01)return'$'+v.toLocaleString('en-US',{minimumFractionDigits:4,maximumFractionDigits:6});
  return'$'+v.toLocaleString('en-US',{minimumFractionDigits:6,maximumFractionDigits:8});
}
function fmtBRL(v,r){if(!v||!r)return'—';var b=v*r;if(b>=1e9)return'R$'+(b/1e9).toFixed(2)+'B';if(b>=1e6)return'R$'+(b/1e6).toFixed(2)+'M';if(b>=1000)return'R$'+b.toLocaleString('pt-BR',{maximumFractionDigits:0});return'R$'+b.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:4});}
function fmtC(v,suf){if(v===null||v===undefined)return'—';return(v>=0?'+':'')+v.toFixed(2)+'%'+(suf||'');}
function fmtB(v){if(!v&&v!==0)return'—';if(v>=1e12)return'$'+(v/1e12).toFixed(2)+'T';if(v>=1e9)return'$'+(v/1e9).toFixed(2)+'B';if(v>=1e6)return'$'+(v/1e6).toFixed(2)+'M';return'$'+v.toLocaleString('en-US',{maximumFractionDigits:0});}
function fmtN(v){if(!v&&v!==0)return'—';return v.toLocaleString('en-US',{maximumFractionDigits:0});}
function clr(v){return v===null||v===undefined?'nt':v>=0?'up':'dn';}
function shortAddr(a){return a?a.slice(0,6)+'…'+a.slice(-4):'';}
function dateStr(s){if(!s)return'—';var d=new Date(s);return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'});}

var CG_PROXIES=['https://corsproxy.io/?url=','https://api.allorigins.win/raw?url='];
function makeFakeResp(json,status){return{ok:status>=200&&status<300,status:status,json:function(){return Promise.resolve(json);}};}
async function cgFetch(url){
  for(var i=0;i<CG_PROXIES.length;i++){
    try{
      var r=await fetch(CG_PROXIES[i]+encodeURIComponent(url));
      if(!r.ok&&r.status!==404)continue;
      var text=await r.text();
      var parsed=JSON.parse(text);
      if(parsed&&typeof parsed.contents==='string'){try{parsed=JSON.parse(parsed.contents);}catch(e2){}}
      return makeFakeResp(parsed,r.status);
    }catch(e){}
  }
  return fetch(url);
}

function tickerApply(d,fb){
  var m=[['bitcoin','tk-btc-p','tk-btc-c'],['ethereum','tk-eth-p','tk-eth-c'],['solana','tk-sol-p','tk-sol-c'],['binancecoin','tk-bnb-p','tk-bnb-c'],['ripple','tk-xrp-p','tk-xrp-c']];
  m.forEach(function(x){var c=d[x[0]];if(!c)return;var pp=document.getElementById(x[1]);var pc=document.getElementById(x[2]);if(pp)pp.textContent=fmtP(c.usd);if(pc){if(fb){pc.textContent='';pc.className='t-chg nt';}else{pc.textContent=fmtC(c.usd_24h_change);pc.className='t-chg '+(c.usd_24h_change>=0?'up':'dn');}}});
  if(d.bitcoin&&d.bitcoin.usd)_btcPrice=d.bitcoin.usd;
  var tr=document.getElementById('ticker-track');if(tr){if(!tr._dup){tr._dup=true;tr.innerHTML+=tr.innerHTML;}}
}
(function(){var t=document.getElementById('ticker-track');if(t&&!t._dup){t._dup=true;t.innerHTML+=t.innerHTML;}})();
function fetchTicker(){
  var fb=setTimeout(function(){tickerApply(_FB,true);},1200);
  cgFetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana,binancecoin,ripple&vs_currencies=usd&include_24hr_change=true')
    .then(function(r){return r.json();}).then(function(d){clearTimeout(fb);tickerApply(d,false);}).catch(function(){clearTimeout(fb);tickerApply(_FB,true);});
  _usdBRL=5.7;
  fetch('https://api.exchangerate-api.com/v4/latest/BRL')
    .then(function(r){return r.json();}).then(function(fx){
      _usdBRL=1/fx.rates.USD;
      var up=document.getElementById('tk-usd-p');if(up)up.textContent='R$'+_usdBRL.toFixed(2).replace('.',',');
      updateSubPrices();
    }).catch(function(){var up=document.getElementById('tk-usd-p');if(up)up.textContent='R$5,70';});
}

// ══ FETCH TOP500 ══
function fetchTop500(){
  cgFetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=250&page=1')
    .then(function(r){return r.json();}).then(function(d){
      if(!Array.isArray(d))return;
      d.forEach(function(coin){var ex=_top500.findIndex(function(c){return c.id===coin.id;});if(ex>=0){_top500[ex]=coin;}else{_top500.push(coin);}});
    }).catch(function(){});
  setTimeout(function(){
    cgFetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=250&page=2')
      .then(function(r){return r.json();}).then(function(d){
        if(!Array.isArray(d))return;
        d.forEach(function(coin){var ex=_top500.findIndex(function(c){return c.id===coin.id;});if(ex>=0){_top500[ex]=coin;}else{_top500.push(coin);}});
      }).catch(function(){});
  },2000);
}

// ══ NAV SEARCH ══
function navTokenSearch(val){
  var dd=document.getElementById('nav-token-dd');
  if(!val||val.length<1){dd.classList.remove('open');return;}
  if(_searchTO)clearTimeout(_searchTO);
  var ql=val.toLowerCase();
  var local=_top500.filter(function(c){return c.name.toLowerCase().indexOf(ql)>=0||c.symbol.toLowerCase().indexOf(ql)>=0;}).slice(0,8);
  if(local.length){renderNavDD(local);}
  _searchTO=setTimeout(function(){
    cgFetch('https://api.coingecko.com/api/v3/search?query='+encodeURIComponent(val))
      .then(function(r){return r.json();}).then(function(d){
        var coins=(d.coins||[]).slice(0,8).map(function(c){
          return{id:c.id,name:c.name,symbol:c.symbol,image:c.thumb,current_price:null,price_change_percentage_24h:null};
        });
        if(coins.length)renderNavDD(coins);
      }).catch(function(){});
  },350);
}
function renderNavDD(coins){
  var dd=document.getElementById('nav-token-dd');
  if(!coins.length){dd.innerHTML='<div class="ntdd-empty">Nenhum resultado encontrado</div>';dd.classList.add('open');return;}
  var html='<div class="ntdd-hdr">Ativos</div>';
  coins.forEach(function(c){
    var chg=c.price_change_percentage_24h;
    var chgHtml=chg!==null&&chg!==undefined?'<span class="ntdd-chg" style="color:'+(chg>=0?'var(--green)':'var(--red)')+'">'+fmtC(chg)+'</span>':'';
    html+='<a class="ntdd-item" href="token.html?id='+c.id+'">'
      +'<img class="ntdd-ico" src="'+(c.image||c.thumb||'')+'\" onerror=\"this.style.background=\'var(--bg4)\'\" loading=\"lazy\">'
      +'<div style="flex:1;min-width:0"><div class="ntdd-name">'+c.name+'</div><div class="ntdd-sym">'+c.symbol.toUpperCase()+'</div></div>'
      +(c.current_price?'<div style="text-align:right"><div class="ntdd-price">'+fmtP(c.current_price)+'</div>'+chgHtml+'</div>':'')
      +'</a>';
  });
  dd.innerHTML=html;dd.classList.add('open');
}

// ══ CHART ══
function drawChart(pts){
  var canvas=document.getElementById('fallback-chart');if(!canvas)return;
  if(_chart){_chart.destroy();_chart=null;}
  var labels=pts.map(function(p){var d=new Date(p[0]);if(_period==='1')return d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});if(_period==='7'||_period==='30')return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});return d.toLocaleDateString('pt-BR',{month:'short',year:'2-digit'});});
  var values=pts.map(function(p){return p[1];});
  var isUp=values[values.length-1]>=values[0];
  var lc=isUp?'#00d68f':'#ff4d6a';
  var ctx=canvas.getContext('2d');
  var grad=ctx.createLinearGradient(0,0,0,240);grad.addColorStop(0,isUp?'rgba(0,214,143,.15)':'rgba(255,77,106,.15)');grad.addColorStop(1,'rgba(0,0,0,0)');
  var step=Math.max(1,Math.floor(labels.length/8));
  _chart=new Chart(ctx,{type:'line',data:{labels:labels.map(function(l,i){return i%step===0?l:'';}),datasets:[{data:values,borderColor:lc,borderWidth:1.8,backgroundColor:grad,fill:true,tension:0.3,pointRadius:0,pointHoverRadius:5,pointHoverBackgroundColor:lc,pointHoverBorderColor:'#fff',pointHoverBorderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{backgroundColor:'rgba(13,14,22,.97)',borderColor:'rgba(255,255,255,.08)',borderWidth:1,titleColor:'#888aa8',bodyColor:'#eeeef8',bodyFont:{family:'JetBrains Mono,monospace',size:12,weight:'600'},titleFont:{family:'DM Sans,sans-serif',size:10},padding:10,callbacks:{title:function(i){return labels[i[0].dataIndex]||'';},label:function(i){return fmtP(i.parsed.y);}}}},
      scales:{x:{grid:{color:'rgba(255,255,255,.03)'},ticks:{color:'#4a4c60',font:{size:9,family:'JetBrains Mono,monospace'},maxRotation:0}},y:{position:'right',grid:{color:'rgba(255,255,255,.03)'},ticks:{color:'#4a4c60',font:{size:9,family:'JetBrains Mono,monospace'},callback:function(v){return fmtP(v);}}}}}});
}
function fetchChart(id,days){
  var wrap=document.getElementById('chart-fallback-wrap');if(!wrap)return;
  var ld=wrap.querySelector('.chart-loading');if(ld)ld.style.display='flex';
  cgFetch('https://api.coingecko.com/api/v3/coins/'+id+'/market_chart?vs_currency=usd&days='+days)
    .then(function(r){return r.json();}).then(function(d){if(ld)ld.style.display='none';if(d.prices&&d.prices.length)drawChart(d.prices);}).catch(function(){if(ld)ld.style.display='none';});
}
function changePeriod(p){
  _period=p;
  document.querySelectorAll('.period-btn').forEach(function(b){b.classList.toggle('active',b.dataset.p===p);});
  fetchChart(_coinId,p);
}

function switchTab(name){
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.toggle('active',b.dataset.tab===name);});
  document.querySelectorAll('.tab-panel').forEach(function(p){p.classList.toggle('active',p.dataset.panel===name);});

}

// ══ AI ANALYSIS ══
async function runAI(coinName,symbol,price,chg24,chg7,chg30,mcap,vol,ath,athChg,rank,layerLabel){
  var wrap=document.getElementById('ai-wrap');if(!wrap)return;
  wrap.innerHTML='<div class="ai-wrap"><div class="ai-header"><span class="ai-badge"><span class="ai-pulse"></span> Gerando análise...</span></div><div class="ai-skel" style="width:100%"></div><div class="ai-skel" style="width:82%"></div><div class="ai-skel" style="width:91%"></div><div class="ai-skel" style="width:76%"></div><div class="ai-skel" style="width:88%"></div></div>';
  var prompt='Você é um analista técnico de criptomoedas sênior do MundoDeFi, um portal educacional brasileiro. Faça uma análise técnica e fundamentalista COMPLETA e DETALHADA do token abaixo, com foco educativo para investidores intermediários. Responda em português brasileiro.\n\nToken: '+coinName+' ('+symbol+')\nCamada/Tipo: '+layerLabel+'\nPreço atual: '+price+'\nVariação 24h: '+chg24+'\nVariação 7d: '+chg7+'\nVariação 30d: '+chg30+'\nMarket Cap: '+mcap+' (Rank #'+rank+')\nVolume 24h: '+vol+'\nATH: '+ath+' ('+athChg+' do ATH)\n\nEstruture sua análise com:\n1. **📊 Cenário Atual** — contexto macro, onde o ativo está no ciclo\n2. **📈 Análise Técnica** — tendência predominante, suportes e resistências chave, momentum (RSI estimado), padrões relevantes\n3. **🏗️ Fundamentos** — avaliação do projeto, market cap vs utilidade, volume relativo, força do ecossistema\n4. **🎯 Níveis de Referência** — zonas de entrada agressiva/conservadora, alvos de price, stop loss sugerido\n5. **⚡ Sinal Geral** — Bull 🟢 ou Bear 🔴? Com convicção de 1-10\n6. **⚠️ Riscos** — 2-3 riscos específicos agora\n\nSeja direto, use dados concretos, escreva como professor ensinando no ao vivo. Máximo 550 palavras.';
  try{
    var ctrl=new AbortController();
    var aiTimer=setTimeout(function(){ctrl.abort();},30000);
    var resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',signal:ctrl.signal,
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:prompt}]})
    });
    clearTimeout(aiTimer);
    if(!resp.ok){throw new Error('AI error '+resp.status);}
    var json=await resp.json();
    var text=(json.content&&json.content[0]&&json.content[0].text)?json.content[0].text:'Análise indisponível.';
    _aiPT=text;
    try{
      var ctrl2=new AbortController();var t2=setTimeout(function(){ctrl2.abort();},20000);
      var r2=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:ctrl2.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:'Translate the following crypto analysis to English, keeping all structure, data, and emojis:\n\n'+text}]})});
      clearTimeout(t2);var j2=await r2.json();
      _aiEN=(j2.content&&j2.content[0]&&j2.content[0].text)?j2.content[0].text:text;
    }catch(e2){_aiEN=text;}
    renderAI(_aiPT);
  }catch(e){
    var w2=document.getElementById('ai-wrap');
    if(w2){var msg=e.name==='AbortError'?'Tempo esgotado. Recarregue.':'Análise temporariamente indisponível.';
      w2.innerHTML='<div style="padding:1rem;font-size:12px;color:var(--muted2)">⚠️ '+msg+'</div>';}
  }
}
function renderAI(text){
  var wrap=document.getElementById('ai-wrap');if(!wrap)return;
  var fmt=text.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
  wrap.innerHTML='<div class="ai-header"><span class="ai-badge"><span class="ai-pulse"></span> Análise IA — MundoDeFi</span>'
    +'<button class="ai-lang-btn" onclick="toggleAILang()">'+(_aiLang==='pt'?'🇺🇸 English':'🇧🇷 Português')+'</button></div>'
    +'<div class="ai-body">'+fmt+'</div>';
}
function toggleAILang(){_aiLang=_aiLang==='pt'?'en':'pt';renderAI(_aiLang==='pt'?_aiPT:_aiEN);}

// ══ TRANSLATE ══
async function translateText(text){
  if(!text)return'';
  var clean=text.replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').substring(0,1200);
  try{
    var r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:700,messages:[{role:'user',content:'Traduza para português brasileiro de forma natural e objetiva. Responda APENAS com a tradução, sem comentários:\n\n'+clean}]})});
    var j=await r.json();return(j.content&&j.content[0]&&j.content[0].text)?j.content[0].text.trim():clean;
  }catch(e){return clean;}
}

function votesentiment(type){
  if(_voteState)return;
  _voteState=type;
  if(type==='bull'){_sentBull=Math.min(95,_sentBull+1);_sentBear=100-_sentBull;}
  else{_sentBear=Math.min(95,_sentBear+1);_sentBull=100-_sentBear;}
  document.querySelectorAll('.vote-btn').forEach(function(b){b.classList.remove('active-bull','active-bear');});
  var btn=document.getElementById('vote-'+type);if(btn)btn.classList.add('active-'+type);

    {k:'Preço Atual',v:'<span style="font-family:var(--mono);font-weight:700">'+fmtP(price)+'</span>'},
    {k:'Preço em BRL',v:'<span id="live-brl-sb" style="font-family:var(--mono)">'+priceBRL+'</span>'},
    {k:'Em BTC',v:'<span style="font-family:var(--mono);font-size:11px">'+priceBTC+'</span>'},
    {k:'ATH',v:'<span style="font-family:var(--mono)">'+( ath?fmtP(ath):'—')+'</span><span class="ath-pct dn">'+(athChg?athChg.toFixed(1)+'%':'')+'</span>'},
    {k:'ATL',v:'<span style="font-family:var(--mono)">'+( atl?fmtP(atl):'—')+'</span>'},
    {k:'Rank Global',v:rank?'<span style="font-family:var(--mono);color:var(--gold)">#'+rank+'</span>':'—'},
    {k:'Market Cap',v:'<span style="font-family:var(--mono)">'+fmtB(mcap)+'</span>'},
    {k:'Vol 24h',v:'<span style="font-family:var(--mono)">'+fmtB(vol)+'</span>'},
  ];
  poRows.forEach(function(r){html+='<div class="po-row"><span class="po-key">'+r.k+'</span><span class="po-val">'+r.v+'</span></div>';});
  html+='</div></div></div>';

  html+='<div class="sidebar-card"><a href="calculadoras.html?token='+symbol+'" class="calc-link"><div class="calc-ico">🧮</div><div><div class="calc-ttl">Calcular Lucro/Perda</div><div class="calc-sub">'+name+' · tempo real</div></div><span style="color:var(--gold);font-size:18px;margin-left:auto">→</span></a></div>';

  html+='<div class="sidebar-card"><div class="sc-hdr">Tokens Similares</div><div class="similar-list">';

    if(rawDesc){

        var el=document.getElementById('about-desc');

      }).catch(function(){});
    }

  _aiParams={name:name,symbol:symbol,price:fmtP(price),chg24:fmtC(chg24),chg7:fmtC(chg7),chg30:fmtC(chg30),mcap:fmtB(mcap),vol:fmtB(vol),ath:fmtP(ath),athChg:athChg?athChg.toFixed(1)+'%':'—',rank:rank||'—',layer:layerInfo.label};
}

function toggleDesc(){
  var d=document.getElementById('about-desc');var b=document.getElementById('read-more-btn');
  if(!d)return;
  var collapsed=d.classList.contains('collapsed');
  d.classList.toggle('collapsed',!collapsed);
  if(b)b.textContent=collapsed?'Ler menos ↑':'Ler mais ↓';
}

// ══ INIT ══
async function init(){
  _coinId=getCoinId();
  if(!_coinId){showError('Nenhum token especificado. Use <strong>token.html?id=bitcoin</strong>');return;}
  try{
    var [coinResp,chartResp]=await Promise.all([
      cgFetch('https://api.coingecko.com/api/v3/coins/'+_coinId+'?localization=false&tickers=true&market_data=true&community_data=true&developer_data=true&sparkline=false'),
      cgFetch('https://api.coingecko.com/api/v3/coins/'+_coinId+'/market_chart?vs_currency=usd&days=7')
    ]);
    if(!coinResp.ok){
      if(coinResp.status===404){showError('Token <strong>'+_coinId+'</strong> não encontrado no CoinGecko.');}
      else{showError('Erro '+coinResp.status+' ao carregar token.');}
      return;
    }
    var coinData=await coinResp.json();
    if(!coinData||coinData.error||!coinData.market_data){
      showError('Token <strong>'+_coinId+'</strong> não encontrado.');return;
    }
    var chartPts=[];
    try{var chartData=await chartResp.json();chartPts=chartData.prices||[];}catch(ec){}
    _data=coinData;
    renderPage(coinData,chartPts);
  }catch(e){
    console.error('init error:',e);
    showError('Erro ao carregar dados. Verifique sua conexão e tente novamente.');
  }
}

fetchTicker();
setTimeout(init,100); // start loading token ASAP
setTimeout(fetchTop500,3000); // search list loads after token data
</script>
