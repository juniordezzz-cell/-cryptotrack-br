<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<script src="/mundodefi-api.js?v=2026-08-22"></script>
<link rel="icon" href="/favicon.svg?v=2026-08-22" type="image/svg+xml">
<title id="page-title">Token — MundoDeFi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>
<script src="/nexus/nexus-auth.js?v=2026-08-22"></script>
<script src="/mundodefi-catalogo.js?v=2026-08-22"></script>
<script src="/mundodefi-cta.js?v=2026-08-22"></script>
<link rel="stylesheet" href="/mundodefi-tokens.css?v=2026-08-22">
<style>
:root{
  /* Cores vêm de /mundodefi-tokens.css. Os nomes locais viram apelidos
     para os tokens do sistema, então nenhum seletor precisou mudar.
     --muted era #3a3c52 e servia de cor de TEXTO em 15 trechos, com
     contraste de 1,88:1 — ilegível. Agora aponta para um nível que
     passa em AA. --muted2 era o mais claro dos dois: a nomenclatura
     estava invertida em relação ao resto do site. */
  --bg:var(--mdf-bg);--bg2:var(--mdf-surface);--bg3:var(--mdf-surface-2);--bg4:var(--mdf-surface-3);
  --border:var(--mdf-line);--border2:var(--mdf-line-2);--border3:var(--mdf-line-3);
  --gold2:var(--mdf-gold-soft);--gold3:rgba(245,182,20,.05);--gold4:rgba(245,182,20,.22);
  --green2:var(--mdf-green-soft);--green3:#00c488;
  --red2:var(--mdf-red-soft);
  --blue2:var(--mdf-blue-soft);
  --text:var(--mdf-text);--muted:var(--mdf-text-3);--muted2:var(--mdf-text-2);
  --font:var(--mdf-font);--display:'Bebas Neue',var(--mdf-font);--mono:var(--mdf-mono);
  --r:var(--mdf-r-sm);--rl:var(--mdf-r);--nav-h:54px;
  --glow-gold:0 0 20px rgba(245,182,20,.15);--glow-green:var(--mdf-glow-green);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:14px}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(245,166,35,.04) 0%,transparent 60%);pointer-events:none;z-index:0}

/* NAV */
nav{position:sticky;top:0;z-index:300;background:rgba(5,6,11,.96);backdrop-filter:blur(24px);border-bottom:1px solid var(--border)}
.nav-inner{display:flex;align-items:center;gap:12px;padding:0 1.5rem;height:var(--nav-h);max-width:1600px;margin:0 auto}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0}
.nav-logo-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--gold),#e08800);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:14px;color:#000;letter-spacing:.05em}
.nav-logo-text{font-family:var(--display);font-size:20px;letter-spacing:.06em;line-height:1;background:linear-gradient(135deg,var(--purple),var(--cyan));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.nav-logo-text span{}
.nav-links{display:flex;align-items:center;gap:2px;flex:1;justify-content:center}
.nav-link{padding:6px 12px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--muted2);text-decoration:none;transition:all .15s;white-space:nowrap}
.nav-link:hover{color:var(--text);background:var(--bg3)}
.nav-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.nav-sw{position:relative}
.nav-si{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);padding:7px 13px 7px 32px;font-size:12px;color:var(--text);font-family:var(--font);width:210px;outline:none;transition:all .2s}
.nav-si:focus{border-color:rgba(245,166,35,.4);width:255px;background:var(--bg4)}
.nav-si::placeholder{color:var(--muted)}
.nav-sico{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.nav-dd{position:absolute;top:calc(100% + 8px);right:0;width:320px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--rl);box-shadow:0 24px 64px rgba(0,0,0,.8);z-index:400;display:none;max-height:380px;overflow-y:auto}
.nav-dd.open{display:block}
.ndd-h{padding:9px 13px 4px;font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.ndd-i{display:flex;align-items:center;gap:10px;padding:8px 13px;cursor:pointer;text-decoration:none;color:var(--text);transition:background .12s}
.ndd-i:hover{background:var(--bg3)}
.ndd-ico{width:26px;height:26px;border-radius:50%;object-fit:cover;background:var(--bg4);flex-shrink:0}
.nbtn{padding:6px 14px;border-radius:var(--r);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all .15s;text-decoration:none;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.nbtn-ghost{background:transparent;border:1px solid var(--border2);color:var(--muted2)}
.nbtn-ghost:hover{color:var(--text);border-color:var(--border3)}
.nbtn-pro{background:linear-gradient(135deg,var(--gold),#d47e00);border:none;color:#000;font-weight:700}
.nbtn-pro:hover{opacity:.88;box-shadow:var(--glow-gold)}

/* TICKER */
.ticker-strip{background:var(--bg2);border-bottom:1px solid var(--border);height:32px;overflow:hidden;position:relative}
.ticker-strip::before,.ticker-strip::after{content:'';position:absolute;top:0;bottom:0;width:60px;z-index:2;pointer-events:none}
.ticker-strip::before{left:0;background:linear-gradient(to right,var(--bg2),transparent)}
.ticker-strip::after{right:0;background:linear-gradient(to left,var(--bg2),transparent)}
.ticker-track{display:flex;align-items:center;height:100%;white-space:nowrap;animation:tickScroll 60s linear infinite}
.ticker-track:hover{animation-play-state:paused}
@keyframes tickScroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.t-item{display:inline-flex;align-items:center;gap:6px;padding:0 16px;height:100%;border-right:1px solid var(--border)}
.t-sym{font-family:var(--mono);font-weight:600;font-size:10.5px;color:var(--muted2)}
.t-price{font-family:var(--mono);font-size:10.5px;color:var(--text);font-weight:500}
.t-chg{font-family:var(--mono);font-size:10px;font-weight:700}
.t-chg.up{color:var(--green)}.t-chg.dn{color:var(--red)}.t-chg.nt{color:var(--muted2)}
.t-dot{width:4px;height:4px;border-radius:50%;flex-shrink:0}
.t-dot.up{background:var(--green)}.t-dot.dn{background:var(--red)}.t-dot.nt{background:var(--muted)}

/* HERO */
.hero{max-width:1600px;margin:0 auto;padding:1rem 1.5rem .6rem;position:relative;z-index:1}
.breadcrumb{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted2);margin-bottom:.75rem}
.breadcrumb a{color:var(--muted2);text-decoration:none}.breadcrumb a:hover{color:var(--text)}
.bc-sep{opacity:.3}
.hero-row{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.hero-l{display:flex;align-items:flex-start;gap:12px}
.hero-logo{width:52px;height:52px;border-radius:50%;border:2px solid var(--border2);background:var(--bg3);object-fit:cover;flex-shrink:0}
.hero-name{font-family:var(--display);font-size:2rem;letter-spacing:.06em;line-height:1.1}
.hero-meta{display:flex;align-items:center;gap:5px;margin-top:.28rem;flex-wrap:wrap}
.htag{font-size:9px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid var(--border);color:var(--muted2);background:var(--bg3);text-transform:uppercase;letter-spacing:.07em}
.htag.l1{border-color:rgba(0,212,255,.25);color:var(--cyan);background:rgba(0,212,255,.06)}
.htag.l2{border-color:rgba(155,89,245,.25);color:var(--purple-txt);background:rgba(155,89,245,.06)}
.htag.defi{border-color:rgba(0,229,160,.25);color:var(--green);background:rgba(0,229,160,.06)}
.htag.rank{border-color:rgba(245,166,35,.2);color:var(--gold);background:var(--gold3);font-family:var(--mono)}
.hero-r{text-align:right;flex-shrink:0}
.hero-price{font-family:var(--mono);font-size:2.8rem;font-weight:700;letter-spacing:-.04em;line-height:1;transition:color .3s}
.hero-chg-row{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:.28rem;flex-wrap:wrap}
.cbadge{font-family:var(--mono);font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}
.cbadge.up{background:var(--green2);color:var(--green);border:1px solid rgba(0,229,160,.15)}
.cbadge.dn{background:var(--red2);color:var(--red);border:1px solid rgba(255,61,90,.15)}
.cbadge.nt{background:var(--bg3);color:var(--muted2);border:1px solid var(--border)}
.hero-sub{display:flex;gap:10px;justify-content:flex-end;margin-top:.22rem}
.sub-i{font-size:11.5px;color:var(--muted2);font-family:var(--mono)}
/* CHANGE BAR */
.chg-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:1600px;margin:.6rem auto;padding:0 1.5rem}
.cc{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:.5rem .65rem;text-align:center;transition:all .2s;cursor:default}
.cc:hover{border-color:var(--border2);background:var(--bg4);transform:translateY(-1px)}
.cc-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:.16rem}
.cc-val{font-family:var(--mono);font-size:13px;font-weight:700}
.cc-val.up{color:var(--green)}.cc-val.dn{color:var(--red)}.cc-val.nt{color:var(--muted2)}

/* 3-COLUMN */
/* Coluna unica: a pagina de token nao disputa busca de ativo, entao nao
   precisa de barra lateral de navegacao entre tokens nem de painel de
   fundamentos. Ela existe para explicar o ativo e levar para a ferramenta. */
.page-cols{max-width:820px;margin:0 auto;padding:0 1.5rem 5rem;position:relative;z-index:1}
.col-center{min-width:0}

.pc{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden}
.pc-price-sec{padding:.78rem 1rem .52rem;border-bottom:1px solid var(--border)}
.pc-chg.up{background:var(--green2);color:var(--green);border:1px solid rgba(0,229,160,.15)}
.pc-chg.dn{background:var(--red2);color:var(--red);border:1px solid rgba(255,61,90,.15)}
.pc-chg.nt{background:var(--bg3);color:var(--muted2);border:1px solid var(--border)}
.pc-supply-lbl{display:flex;justify-content:space-between;font-size:9px;color:var(--muted2);margin-bottom:.28rem}
.pc-supply-bg{height:3px;background:var(--bg4);border-radius:99px;overflow:hidden}
.pc-supply-fill{height:100%;background:linear-gradient(90deg,var(--gold),#d47e00);border-radius:99px;transition:width .8s ease}
.pc-buy.prim{background:linear-gradient(135deg,var(--gold),#d47e00);color:#000}
.pc-buy.prim:hover{opacity:.88;box-shadow:var(--glow-gold)}
.pc-buy.sec{background:var(--green2);color:var(--green);border:1px solid rgba(0,229,160,.2)}
.pc-buy.sec:hover{background:rgba(0,229,160,.18);box-shadow:var(--glow-green)}

.live-ind{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.08em}
.live-ind span{width:6px;height:6px;border-radius:50%;background:var(--green);animation:livePulse 1.5s infinite;display:inline-block}
@keyframes livePulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(0,229,160,.4)}50%{opacity:.7;box-shadow:0 0 0 5px rgba(0,229,160,0)}}

/* FERRAMENTAS PARA ESTE ATIVO */
.tools-ativo{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border)}
.ta{display:flex;align-items:center;gap:11px;padding:.9rem 1.1rem;background:var(--bg2);text-decoration:none;color:var(--text);transition:background .15s}
.ta:hover{background:var(--bg3)}
.ta-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:var(--bg4)}
.ta-nome{font-size:12.5px;font-weight:700;line-height:1.3}
.ta-desc{font-size:11px;color:var(--muted);line-height:1.45;margin-top:2px}
.ta-seta{margin-left:auto;color:var(--muted);font-size:13px}
@media(max-width:600px){.tools-ativo{grid-template-columns:1fr}}

/* EXPLICAÇÃO DO ATIVO */
.explica{padding:1.05rem 1.2rem}
.explica p{font-size:13.5px;line-height:1.75;color:var(--text-dim,#b8b8c4);margin:0 0 .85rem}
.explica p:last-child{margin-bottom:0}
.explica ul{list-style:none;margin:.2rem 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.explica li{font-size:12.5px;line-height:1.5;color:var(--muted);padding-left:18px;position:relative}
.explica li::before{content:'·';position:absolute;left:5px;color:var(--gold);font-weight:700}
.explica-aviso{margin-top:1rem;padding-top:.8rem;border-top:1px solid var(--border);font-size:11px;color:var(--muted2);line-height:1.6}

/* CENTER */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;margin-bottom:12px}
.card:last-child{margin-bottom:0}
.card-hdr{padding:.7rem 1.1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card-ttl{font-family:var(--display);font-size:13px;letter-spacing:.08em;color:var(--muted2);text-transform:uppercase}.tv-wrap iframe{width:100%;height:100%;border:none}
.chart-wrap{height:200px;padding:.7rem;position:relative}
.chart-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:6px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--gold);animation:dp 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes dp{0%,80%,100%{opacity:.2}40%{opacity:1}}
.period-btns{display:flex;gap:3px}
.period-btn{padding:3px 9px;border-radius:99px;border:1px solid var(--border);font-size:10px;font-weight:600;color:var(--muted2);cursor:pointer;background:transparent;transition:all .15s;font-family:var(--mono)}
.period-btn:hover{color:var(--text)}.period-btn.active{background:var(--gold2);border-color:rgba(245,166,35,.3);color:var(--gold)}

/* TABLES */
.tbl-wrap{overflow-x:auto}
.dt{width:100%;border-collapse:collapse;font-size:12px}
.dt th{padding:.5rem .8rem;text-align:left;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap}
.dt td{padding:.56rem .8rem;border-bottom:1px solid var(--border);vertical-align:middle}
.dt tr:last-child td{border-bottom:none}.dt tr:hover td{background:var(--bg3)}
.ex-logo{width:16px;height:16px;border-radius:4px;margin-right:5px;vertical-align:middle;background:var(--bg3)}
.pair-badge{font-family:var(--mono);font-size:10.5px;background:var(--bg3);padding:2px 7px;border-radius:5px;border:1px solid var(--border)}
.buy-btn{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:5px;background:var(--green2);border:1px solid rgba(0,229,160,.2);color:var(--green);font-size:10px;font-weight:700;text-decoration:none;transition:all .15s}
.buy-btn:hover{background:rgba(0,229,160,.18);box-shadow:var(--glow-green)}


.cmp-tbl th{padding:.42rem .5rem;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;border-bottom:1px solid var(--border)}
.cmp-tbl td{padding:.46rem .5rem;border-bottom:1px solid var(--border);vertical-align:middle;font-family:var(--mono)}
.cmp-tbl tr:last-child td{border-bottom:none}.cmp-tbl tr:hover td{background:var(--bg3)}
.cb{font-size:9px;font-weight:700;padding:2px 6px;border-radius:99px}
.cb.better{background:var(--green2);color:var(--green);border:1px solid rgba(0,229,160,.2)}
.cb.worse{background:var(--red2);color:var(--red);border:1px solid rgba(255,61,90,.2)}

@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.4)}}
@keyframes skelShim{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* VOTE */
.active-bull{background:var(--green2)!important;border-color:rgba(0,229,160,.3)!important;color:var(--green)!important}
.active-bear{background:var(--red2)!important;border-color:rgba(255,61,90,.3)!important;color:var(--red)!important}

/* RIGHT COLUMN */
/* CMC-style table */
.sim-tbl td{padding:.5rem .72rem;border-bottom:1px solid var(--border);vertical-align:middle}
.sim-tbl tr:last-child td{border-bottom:none}
.sim-tbl tr:hover td{background:var(--bg3);cursor:pointer}
.s-logo-td{width:26px;padding-left:5px!important;padding-right:3px!important}
.s-chg.up{color:var(--green)}.s-chg.dn{color:var(--red)}.s-chg.nt{color:var(--muted2)}

/* FEAR & GREED */
.fg-gauge-area{display:flex;flex-direction:column;align-items:center;margin-bottom:.72rem}
.fg-canvas-wrap{position:relative;width:154px;height:84px}
.fg-val-lbl{position:absolute;bottom:0;left:50%;transform:translateX(-50%);text-align:center}
.fg-name-lbl{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-top:.1rem}
.fg-hist-row{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}

/* SKEL / ERROR */
.skel{border-radius:var(--r);background:linear-gradient(90deg,var(--bg3) 25%,var(--bg4) 50%,var(--bg3) 75%);background-size:200% 100%;animation:skelShim 1.4s infinite}
.err-state{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:14px;text-align:center;padding:2rem}
.err-ttl{font-family:var(--display);font-size:1.6rem;letter-spacing:.06em}
.err-sub{font-size:13px;color:var(--muted2);max-width:400px;line-height:1.7}
.back-btn{padding:9px 20px;border-radius:var(--r);background:var(--bg3);border:1px solid var(--border2);color:var(--text);text-decoration:none;font-size:12px;font-weight:600;margin-top:.4rem}

footer{background:var(--bg2);border-top:1px solid var(--border);padding:1.2rem;text-align:center;font-size:11px;color:var(--muted2)}
footer a{color:var(--muted2);text-decoration:none}footer a:hover{color:var(--text)}
@media(max-width:768px){.hero-price{font-size:2rem}.hero-name{font-size:1.5rem}.chg-bar{grid-template-columns:repeat(3,1fr)}.hero,.chg-bar{padding-left:1rem;padding-right:1rem}.page-cols{padding:0 1rem 4rem}
  /* O nav nunca teve tratamento mobile: os links e a busca de 210px fixos
     empurravam a barra para ~925px numa tela de 360px, e a pagina inteira
     rolava de lado. Abaixo de 768px os links de texto saem e a busca passa
     a ser fluida — em telefone, buscar ativo importa mais que os atalhos. */
  .nav-links{display:none}
  .nav-inner{gap:10px}
  .nav-right{flex:1;justify-content:flex-end;min-width:0}
  .nav-sw{flex:1;min-width:0}
  .nav-si{width:100%}
}
@media(max-width:420px){
  .nav-logo-text{display:none}
  .nav-si{font-size:12.5px;padding-left:30px}
}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="/index.html" class="nav-logo">
      <div class="nav-logo-mark">M</div>
      <span class="nav-logo-text">Mundo<span>DeFi</span></span>
    </a>
    <div class="nav-links">
      <a href="/ferramentas/ferramentas.html" class="nav-link">Ferramentas</a>
      <a href="/portfolio/index.html" class="nav-link">Portfólio</a>
      <a href="/planos.html" class="nav-link">Planos</a>
    </div>
    <div class="nav-right">
      <div class="nav-sw">
        <span class="nav-sico">⌕</span>
        <input class="nav-si" id="nav-s" placeholder="Buscar ativo..." autocomplete="off"
          oninput="navSearch(this.value)"
          onblur="setTimeout(()=>{document.getElementById('nav-dd').classList.remove('open')},200)">
        <div class="nav-dd" id="nav-dd"></div>
      </div>
      <a href="/portfolio/index.html" class="nbtn nbtn-ghost">📊 Portfólio</a>
      <a href="/planos.html" class="nbtn nbtn-pro">👑 PRO</a>
    </div>
  </div>
</nav>

// ═══════════════════════════════════
// FORMATTERS
// ═══════════════════════════════════
function fmtP(v){
  if(v===null||v===undefined||isNaN(v))return'—';
  if(v>=10000)return'$'+v.toLocaleString('en-US',{maximumFractionDigits:0});
  if(v>=1000)return'$'+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  if(v>=1)return'$'+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:4});
  if(v>=0.01)return'$'+v.toLocaleString('en-US',{minimumFractionDigits:4,maximumFractionDigits:6});
  return'$'+v.toLocaleString('en-US',{minimumFractionDigits:6,maximumFractionDigits:8});
}
function fmtBRL(v){
  if(!v||!_usdBRL)return'—';
  var b=v*_usdBRL;
  if(b>=1e9)return'R$'+(b/1e9).toFixed(2)+'B';
  if(b>=1e6)return'R$'+(b/1e6).toFixed(2)+'M';
  if(b>=1000)return'R$'+b.toLocaleString('pt-BR',{maximumFractionDigits:0});
  return'R$'+b.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:4});
}
function fmtC(v){if(v===null||v===undefined||isNaN(v))return'—';return(v>=0?'+':'')+Number(v).toFixed(2)+'%';}
function fmtB(v){
  if(!v&&v!==0)return'—';
  if(v>=1e12)return'$'+(v/1e12).toFixed(2)+'T';
  if(v>=1e9)return'$'+(v/1e9).toFixed(2)+'B';
  if(v>=1e6)return'$'+(v/1e6).toFixed(2)+'M';
  return'$'+v.toLocaleString('en-US',{maximumFractionDigits:0});
}
function fmtN(v){if(!v&&v!==0)return'—';return v.toLocaleString('en-US',{maximumFractionDigits:0});}
function clr(v){return v===null||v===undefined||isNaN(v)?'nt':parseFloat(v)>=0?'up':'dn';}
function dateStr(s){if(!s)return'—';return new Date(s).toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'});}
function shortAddr(a){return a?a.slice(0,6)+'…'+a.slice(-4):'';}

function getBinanceSym(cgId){
  var base=ID_TO_SYM[cgId]||(cgId.split('-')[0].toUpperCase());
  if(STABLES.includes(base))return null;
  return base+'USDT';
}
async function binFetch(url){
  try{
    var c=new AbortController();
    setTimeout(function(){c.abort();},5000);
    var r=await fetch(url,{signal:c.signal});
    if(!r.ok)return null;
    return r.json();
  }catch(e){return null;}
}
async function binTicker(sym){return binFetch('https://api.binance.com/api/v3/ticker/24hr?symbol='+sym);}
async function binMulti(syms){
  if(!syms.length)return[];
  var d=await binFetch('https://api.binance.com/api/v3/ticker/24hr?symbols='+encodeURIComponent(JSON.stringify(syms)));
  return Array.isArray(d)?d:[];
}
async function binKlines(sym,interval,limit){
  var d=await binFetch('https://api.binance.com/api/v3/klines?symbol='+sym+'&interval='+interval+'&limit='+limit);
  return Array.isArray(d)?d:[];
}

function cgCacheGet(id){
  try{var c=localStorage.getItem('cgm_'+id);if(!c)return null;var p=JSON.parse(c);if(Date.now()-p.ts>300000)return null;return p.d;}catch(e){return null;}
}
function cgCacheSet(id,d){try{localStorage.setItem('cgm_'+id,JSON.stringify({d:d,ts:Date.now()}));}catch(e){}}
async function cgMeta(id){
  var cached=cgCacheGet(id);if(cached)return cached;
  try{
    var c=new AbortController();setTimeout(function(){c.abort();},7000);
    var r=await fetch('https://api.coingecko.com/api/v3/coins/'+id+'?localization=false&tickers=false&market_data=true&community_data=false&developer_data=false&sparkline=false',{signal:c.signal});
    if(!r.ok)return null;
    var d=await r.json();
    if(d&&d.market_data)cgCacheSet(id,d);
    return d;
  }catch(e){return null;}
}

function connectWS(symbol){
  if(_ws){try{_ws.close();}catch(e){}}
  _ws=new WebSocket('wss://stream.binance.com:9443/ws/'+symbol.toLowerCase()+'@miniTicker');
  _ws.onmessage=function(e){
    try{
      var d=JSON.parse(e.data);
      var price=parseFloat(d.c);
      var chg=((price-parseFloat(d.o))/parseFloat(d.o))*100;
      updateLive(price,chg);
    }catch(ex){}
  };
  _ws.onclose=function(){setTimeout(function(){if(_sym)connectWS(_sym+'USDT');},5000);};
  _ws.onerror=function(){_ws.close();};
}
function updateLive(price,chg){
  var col=chg>=0?'var(--green)':'var(--red)';
  var ps=fmtP(price);
  var hp=document.getElementById('hero-price');if(hp){hp.textContent=ps;hp.style.color=col;}
  var pp=document.getElementById('pc-price');if(pp){pp.textContent=ps;pp.style.color=col;}
  var pb=document.getElementById('pc-brl');if(pb)pb.textContent=fmtBRL(price);
  var btcEl=document.getElementById('pc-btc');if(btcEl&&_btcPrice&&_sym!=='BTC')btcEl.textContent=(price/_btcPrice).toFixed(8)+' BTC';
}

// ═══════════════════════════════════
// CHART (Binance klines)
// ═══════════════════════════════════
function drawChart(klines){
  var canvas=document.getElementById('main-chart');if(!canvas)return;
  if(_chart){_chart.destroy();_chart=null;}
  if(!klines||!klines.length)return;
  var vals=klines.map(function(k){return parseFloat(k[4]);});
  var labels=klines.map(function(k){
    var d=new Date(k[0]);
    if(_period==='1d')return d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    if(_period==='7d'||_period==='30d')return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});
    return d.toLocaleDateString('pt-BR',{month:'short',year:'2-digit'});
  });
  var isUp=vals[vals.length-1]>=vals[0];
  var lc=isUp?'#14F195':'#FF4D6A';
  var ctx=canvas.getContext('2d');
  var grad=ctx.createLinearGradient(0,0,0,200);
  grad.addColorStop(0,isUp?'rgba(0,229,160,.14)':'rgba(255,61,90,.14)');
  grad.addColorStop(1,'rgba(0,0,0,0)');
  var step=Math.max(1,Math.floor(labels.length/8));
  _chart=new Chart(ctx,{
    type:'line',
    data:{labels:labels.map(function(l,i){return i%step===0?l:'';}),datasets:[{data:vals,borderColor:lc,borderWidth:2,backgroundColor:grad,fill:true,tension:0.3,pointRadius:0,pointHoverRadius:4,pointHoverBackgroundColor:lc}]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{backgroundColor:'rgba(10,11,18,.97)',borderColor:'rgba(255,255,255,.07)',borderWidth:1,titleColor:'#7a7c96',bodyColor:'#f0f0fa',bodyFont:{family:'JetBrains Mono,monospace',size:12,weight:'600'},padding:10,callbacks:{title:function(i){return labels[i[0].dataIndex]||'';},label:function(i){return fmtP(i.parsed.y);}}}},
      scales:{x:{grid:{color:'rgba(255,255,255,.025)'},ticks:{color:'#3a3c52',font:{size:9,family:'JetBrains Mono,monospace'},maxRotation:0}},y:{position:'right',grid:{color:'rgba(255,255,255,.025)'},ticks:{color:'#3a3c52',font:{size:9,family:'JetBrains Mono,monospace'},callback:function(v){return fmtP(v);}}}}}
  });
}
function changePeriod(p){
  _period=p;
  document.querySelectorAll('.period-btn').forEach(function(b){b.classList.toggle('active',b.dataset.p===p);});
  if(!_sym)return;
  var pm=PERIOD_MAP[p]||PERIOD_MAP['7d'];
  var ld=document.getElementById('chart-ld');if(ld)ld.style.display='flex';
  binKlines(_sym+'USDT',pm.i,pm.l).then(function(k){if(ld)ld.style.display='none';drawChart(k);});
}

async function loadSimilar(currentId){
  var list=TOP_COINS.filter(function(c){return c.id!==currentId;}).slice(0,14);
  var nonStable=list.filter(function(c){return !STABLES.includes(c.sym);}).map(function(c){return c.sym+'USDT';});
  var tickers=await binMulti(nonStable);
  var tm={};tickers.forEach(function(t){tm[t.symbol]=t;});
  var tbody=document.getElementById('sim-tbody');if(!tbody)return;
  tbody.innerHTML=list.map(function(c){
    var t=tm[c.sym+'USDT'];
    var price=t?fmtP(parseFloat(t.lastPrice)):'—';
    var chg=t?parseFloat(t.priceChangePercent):null;
    return'<tr onclick="location.href=\'/token.html?id='+c.id+'\'">'
      +'<td class="s-rank">'+c.rank+'</td>'

      +'<td><div class="s-name">'+c.name+'</div><div class="s-sym">'+c.sym+'</div></td>'

      +'</tr>';
  }).join('');
}

function fgColor(v){return v<=25?'#FF4D6A':v<=45?'#ff8c42':v<=55?'#F5B614':v<=75?'#00E5FF':'#14F195';}
function fgLabel(v){return v<=25?'Medo':v<=45?'Medo':v<=55?'Neutro':v<=75?'Ganância':'Ganância Ext.';}
function drawFG(val,cid){
  var canvas=document.getElementById(cid);if(!canvas)return;
  var ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height,cx=W/2,cy=H-8,r=H-20;
  ctx.clearRect(0,0,W,H);
  ctx.beginPath();ctx.arc(cx,cy,r,Math.PI,2*Math.PI,false);
  ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=12;ctx.lineCap='round';ctx.stroke();
  var g=ctx.createLinearGradient(cx-r,cy,cx+r,cy);
  g.addColorStop(0,'#FF4D6A');g.addColorStop(.5,'#F5B614');g.addColorStop(1,'#14F195');
  ctx.beginPath();ctx.arc(cx,cy,r,Math.PI,Math.PI+(val/100)*Math.PI,false);
  ctx.strokeStyle=g;ctx.lineWidth=12;ctx.lineCap='round';ctx.stroke();
  var na=Math.PI+(val/100)*Math.PI;
  ctx.save();ctx.translate(cx,cy);ctx.rotate(na);
  ctx.beginPath();ctx.moveTo(-2,0);ctx.lineTo(0,-(r-4));ctx.lineTo(2,0);
  ctx.fillStyle='#f0f0fa';ctx.fill();ctx.restore();
  ctx.beginPath();ctx.arc(cx,cy,5,0,2*Math.PI);ctx.fillStyle='#f0f0fa';ctx.fill();
}
async function fetchFG(){
  var wrap=document.getElementById('fg-wrap');if(!wrap)return;
  try{
    var r=await fetch('https://api.alternative.me/fng/?limit=31');
    var d=await r.json();
    if(!d.data||!d.data.length)throw new Error('no data');
    var val=parseInt(d.data[0].value)||50;
    var color=fgColor(val);
    var h1=d.data[1]?parseInt(d.data[1].value):0;
    var h7=d.data[7]?parseInt(d.data[7].value):0;

function ferramentasDoAtivo(sym,id){
  var alvo=document.getElementById('tools-ativo');
  if(!alvo||!window.MDF_CATALOGO)return;
  var quero=['conversor','lucro-cripto','staking','pool-liquidez','comparador-de-ativos','portfolio'];
  var html=quero.map(function(slug){
    var f=MDF_CATALOGO.porSlug(slug); if(!f)return '';
    var url=f.url, desc=f.curto;
    /* Cada ferramenta ja chega preenchida com o ativo aberto. Sem isso o
       usuario clicava e tinha que digitar o ticker de novo — o ciclo
       busca -> pagina de token -> ferramenta quebrava no ultimo passo. */
    if(slug==='conversor'){url+='?cripto='+encodeURIComponent(id); desc='Quanto vale '+sym+' em reais';}
    if(slug==='lucro-cripto'){url+='?token='+encodeURIComponent(id); desc='Seu lucro real em '+sym+', com taxas';}
    if(slug==='staking'){url+='?token='+encodeURIComponent(sym); desc='Quanto rende '+sym+' em staking';}

// ═══════════════════════════════════
// SEO DA PÁGINA DE TOKEN
//
// Esta página serve dezenas de URLs (?id=bitcoin, ?id=solana...) a partir
// do MESMO HTML. Sem canonical, o Google vê o mesmo documento repetido e
// tem que adivinhar qual indexar. Sem description, ele inventa o resumo do
// resultado de busca. E sem og:, o link colado no WhatsApp — que no Brasil
// é metade do compartilhamento — aparece pelado.
//
// O sitemap já manda o Google para seis dessas URLs, então isso não era
// detalhe: era mandar visita para uma página que não sabe se apresentar.
//
// Roda em dois momentos: primeiro só com o id da URL, para o canonical
// nascer certo; depois de novo com nome, símbolo e logo, quando chegam.
// ═══════════════════════════════════
var SITE = 'https://mundodefi.com.br';

function metaTag(seletor, criar) {
  var el = document.head.querySelector(seletor);
  if (!el) { el = criar(); document.head.appendChild(el); }
  return el;
}
function setMeta(nome, valor) {
  if (!valor) return;
  metaTag('meta[name="' + nome + '"]', function () {
    var m = document.createElement('meta'); m.setAttribute('name', nome); return m;
  }).setAttribute('content', valor);
}
function setOG(prop, valor) {
  if (!valor) return;
  metaTag('meta[property="' + prop + '"]', function () {
    var m = document.createElement('meta'); m.setAttribute('property', prop); return m;
  }).setAttribute('content', valor);
}
function setLink(rel, href) {
  if (!href) return;
  metaTag('link[rel="' + rel + '"]', function () {
    var l = document.createElement('link'); l.setAttribute('rel', rel); return l;
  }).setAttribute('href', href);
}

function tituloDeBusca(nome, sym) {
  /* O que o brasileiro digita é "cotação do bitcoin", não "bitcoin token
     page". O título fala a língua da busca sem prometer o que a página não
     entrega — ela tem gráfico, explicação e as ferramentas. */
  return nome + (sym ? ' (' + sym + ')' : '') + ' — cotação hoje em real e dólar | MundoDeFi';
}

function descricaoDeBusca(id, nome, sym) {
  var curada = (typeof _descCache !== 'undefined' && _descCache) ? _descCache[id] : null;
  var base = curada && curada.texto
    ? String(curada.texto).replace(/\s+/g, ' ').trim()
    : '';
  if (base) {
    /* Junta frases inteiras até perto de 155 caracteres. Cortar na primeira
       frase deixava descrição de 60 caracteres, curta demais para o
       resultado de busca; cortar no caractere 155 partia palavra ao meio. */
    var frases = base.split(/(?<=\.)\s+/), texto = '';
    for (var i = 0; i < frases.length; i++) {
      if (texto && (texto + ' ' + frases[i]).length > 158) break;
      texto = texto ? texto + ' ' + frases[i] : frases[i];
    }
    if (texto.length > 158) texto = texto.slice(0, 155).replace(/\s+\S*$/, '') + '…';
    /* Quando a primeira frase é curta e a segunda não cabe, sobra uma
       description de 60 caracteres — espaço desperdiçado no resultado de
       busca. Completa com o que a página de fato entrega. */
    if (texto.length < 100) {
      var extra = ' Veja a cotação ao vivo em real e dólar, gráfico e ferramentas.';
      if ((texto + extra).length <= 158) texto += extra;
    }
    return texto;
  }
  return 'Cotação de ' + nome + (sym ? ' (' + sym + ')' : '') + ' ao vivo em real e dólar, com gráfico '
       + 'e as ferramentas do MundoDeFi para calcular lucro, staking e pool de liquidez.';
}

var _seoNome = '', _seoLogo = '';
function naoIndexar() {
  setMeta('robots', 'noindex,follow');
  var c = document.head.querySelector('link[rel="canonical"]');
  if (c) c.remove();
  var o = document.head.querySelector('meta[property="og:url"]');
  if (o) o.remove();
}

function aplicarSEO(id, nome, sym, logo) {
  if (!id) return;
  id = String(id).toLowerCase().trim();
  sym = (sym || '').toUpperCase();

  /* A função é chamada em três momentos e nem todos conhecem o nome bom:
     um deles passa o próprio símbolo. Guardamos o melhor visto até agora
     para o título nunca piorar de "Solana (SOL)" para "SOL (SOL)". */
  nome = String(nome || '').trim();
  if (nome && nome.toUpperCase() !== sym && nome.length > _seoNome.length) _seoNome = nome;
  nome = _seoNome || (id.charAt(0).toUpperCase() + id.slice(1)).replace(/-/g, ' ');
  if (logo) _seoLogo = logo;
  logo = _seoLogo;

  /* Quando existe pagina escrita para esta moeda em /moedas/, e' ela que
     deve ser indexada: tem o texto no HTML, enquanto esta aqui so' se monta
     depois do JavaScript. O conjunto de paginas geradas e' exatamente o
     conjunto de moedas com texto curado, entao _descCache serve de indice
     sem precisar de outra chamada. */
  var temPaginaPropria = (typeof _descCache !== 'undefined' && _descCache && _descCache[id]);
  var url = temPaginaPropria
    ? SITE + '/moedas/' + encodeURIComponent(id) + '.html'
    : SITE + '/token.html?id=' + encodeURIComponent(id);
  var titulo = tituloDeBusca(nome, sym);
  var desc = descricaoDeBusca(id, nome, sym);

  document.title = titulo;
  setLink('canonical', url);
  setMeta('description', desc);
  setOG('og:type', 'website');
  setOG('og:locale', 'pt_BR');
  setOG('og:site_name', 'MundoDeFi');
  setOG('og:url', url);
  setOG('og:title', titulo);
  setOG('og:description', desc);
  if (logo) setOG('og:image', logo);
  setMeta('twitter:card', logo ? 'summary' : 'summary');
  setMeta('twitter:title', titulo);
  setMeta('twitter:description', desc);
  if (logo) setMeta('twitter:image', logo);
}

// ═══════════════════════════════════
// INIT — Fase 1: Binance (<200ms), Fase 2: CoinGecko lazy
// ═══════════════════════════════════
async function init(){
  _coinId=new URLSearchParams(window.location.search).get('id')||'';
  if(!_coinId){showError('Nenhum token especificado. Use <strong>?id=bitcoin</strong>');return;}
  _coinId=_coinId.toLowerCase().trim();
  /* canonical e og:url antes de qualquer chamada: se a API demorar ou
     falhar, a página já sabe quem ela é */
  aplicarSEO(_coinId);
  var sym=getBinanceSym(_coinId);

  // Stablecoin ou sem symbol: vai direto ao CoinGecko
  if(!sym){
    var cgOnly=await cgMeta(_coinId);
    if(!cgOnly){showError('Token não encontrado: <strong>'+_coinId+'</strong>');return;}
    _sym=ID_TO_SYM[_coinId]||_coinId.toUpperCase();
    var md=cgOnly.market_data;
    renderPage({lastPrice:md.current_price.usd,priceChangePercent:md.price_change_percentage_24h,highPrice:md.high_24h?md.high_24h.usd:0,lowPrice:md.low_24h?md.low_24h.usd:0,quoteVolume:md.total_volume?md.total_volume.usd:0,count:'—'},cgOnly);
    return;
  }
  _sym=sym.replace('USDT','');

  // FASE 1 — Binance ticker (rápido, direto, sem proxy)
  var binData=await binTicker(sym);

  if(!binData||!binData.lastPrice){
    // Binance falhou, tenta CoinGecko completo
    var fallback=await cgMeta(_coinId);
    if(!fallback){showError('Token não encontrado: <strong>'+_coinId+'</strong>');return;}
    var md2=fallback.market_data;
    renderPage({lastPrice:md2.current_price.usd,priceChangePercent:md2.price_change_percentage_24h,highPrice:md2.high_24h?md2.high_24h.usd:0,lowPrice:md2.low_24h?md2.low_24h.usd:0,quoteVolume:md2.total_volume?md2.total_volume.usd:0,count:'—'},fallback);
    return;
  }

  // Renderiza IMEDIATAMENTE com dados Binance (metadados provisórios)
  var tempMeta={name:_sym,image:{large:''},market_cap_rank:null,market_data:{current_price:{usd:parseFloat(binData.lastPrice)},market_cap:{usd:null},fully_diluted_valuation:{usd:null},total_volume:{usd:parseFloat(binData.quoteVolume)},circulating_supply:null,max_supply:null,ath:{usd:null},atl:{usd:null},ath_change_percentage:{usd:null},ath_date:{usd:null},price_change_percentage_7d:null,price_change_percentage_30d:null,price_change_percentage_1h_in_currency:{usd:null}},categories:[],tickers:[],description:{en:''},links:{},genesis_date:null,hashing_algorithm:null,coingecko_score:null};
  renderPage(binData,tempMeta);

  // FASE 2 — CoinGecko metadata (lazy ~1-3s, atualiza silenciosamente)
  cgMeta(_coinId).then(function(cg){
    if(!cg)return;
    // Atualiza logo
    var logo=cg.image&&cg.image.large?cg.image.large:'';
    if(logo){
      var hl=document.getElementById('hero-logo');if(hl){hl.src=logo;hl.style.display='block';}
      var pl=document.getElementById('pc-logo');if(pl)pl.src=logo;
    }
    // Atualiza nome
    if(cg.name){
      var hn=document.getElementById('hero-name');if(hn)hn.textContent=cg.name.toUpperCase();
      var pn=document.getElementById('pc-tname');if(pn)pn.textContent=cg.name;
      aplicarSEO(_coinId, cg.name, _sym, (cg.image&&(cg.image.large||cg.image.small))||'');
    }
    // Atualiza rank e mcap
    if(cg.market_cap_rank){
      var hr=document.getElementById('hero-rank');if(hr)hr.textContent='#'+cg.market_cap_rank;
    }
    if(cg.market_data&&cg.market_data.market_cap){
      var mc=document.getElementById('pc-mcap');if(mc)mc.textContent=fmtB(cg.market_data.market_cap.usd);
    }
    // Atualiza descrição
    if(cg.description&&cg.description.en){
    }
    // Atualiza exchanges
  }).catch(function(){});
}
