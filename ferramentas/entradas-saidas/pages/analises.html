<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,follow">
<title>Controle Financeiro | Análises</title>
  <link rel="icon" href="../assets/logo/logo.svg">
  <link rel="stylesheet" href="/mundodefi-tokens.css?v=20b975831e">
  <link rel="stylesheet" href="../css/styles.css?v=20b975831e">
  <link rel="stylesheet" href="../css/sidebar.css?v=20b975831e">
  <link rel="stylesheet" href="../css/cards.css?v=20b975831e">
  <link rel="stylesheet" href="../css/dashboard.css?v=20b975831e">
  <link rel="stylesheet" href="../css/tables.css?v=20b975831e">
  <link rel="stylesheet" href="../css/forms.css?v=20b975831e">
  <link rel="stylesheet" href="../css/planner.css?v=20b975831e">
  <link rel="stylesheet" href="../css/nexus.css?v=20b975831e">
  <link rel="stylesheet" href="../css/responsive.css?v=20b975831e">
</head>
<body data-page="analises">
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="../index.html" aria-label="Controle Financeiro"><img src="../assets/logo/logo.svg" alt="Controle Financeiro"></a>
      <a class="back-home" href="https://mundodefi.com.br"><span aria-hidden="true">←</span> Voltar ao MundoDeFi</a>
      <nav class="sidebar-nav" aria-label="Menu principal">
        <a class="nav-link" href="../index.html" data-nav="dashboard"><span class="nav-icon dashboard"></span><span>Dashboard</span></a>
        <a class="nav-link" href="entradas-saidas.html" data-nav="comparativo"><span class="nav-icon comparativo"></span><span>Entradas x Saídas</span></a>
        <a class="nav-link" href="entradas.html" data-nav="entradas"><span class="nav-icon entradas"></span><span>Entradas</span></a>
        <a class="nav-link" href="despesas.html" data-nav="despesas"><span class="nav-icon despesas"></span><span>Despesas</span></a>
        <a class="nav-link" href="investimentos.html" data-nav="investimentos"><span class="nav-icon investimentos"></span><span>Investimentos</span></a>
        <a class="nav-link" href="relatorios.html" data-nav="relatorios"><span class="nav-icon relatorios"></span><span>Relatórios</span></a>
        <a class="nav-link" href="analises.html" data-nav="analises"><span class="nav-icon analises"></span><span>Análises</span></a>
      </nav>
      <div class="sidebar-footer">
        <a class="nav-link" href="configuracoes.html" data-nav="configuracoes"><span class="nav-icon configuracoes"></span><span>Configurações</span></a>
        <a class="nav-link" href="/cadastro.html" data-logout><span class="nav-icon sair"></span><span>Sair</span></a>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <button class="icon-button menu-toggle" type="button" data-menu-toggle aria-label="Abrir menu">☰</button>
        <div class="topbar-title">
          <h1>Análises</h1>
          <p>Seus gráficos do ano: renda média por mês e gasto por categoria</p>
        </div>
        <div class="topbar-actions">
          <span class="status-pill" data-analise-ano>—</span>
        </div>
      </header>

      <!-- Gráfico fixo: renda mês a mês + média mensal do ano -->
      <section class="card pad">
        <div class="chart-head">
          <h2 class="section-title">Renda mês a mês no ano</h2>
          <span class="planner-badge green">Média mensal: <strong data-renda-media style="margin-left:6px;">R$ 0,00</strong></span>
        </div>
        <div class="canvas-wrap">
          <canvas id="rendaAnualChart" aria-label="Gráfico da renda por mês no ano"></canvas>
        </div>
      </section>

      <!-- Gráfico dinâmico: escolha uma categoria e veja mês a mês -->
      <section class="card pad" style="margin-top: 14px;">
        <div class="chart-head">
          <h2 class="section-title">Gasto por categoria, mês a mês</h2>
          <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
            <input id="analiseBusca" class="input-control" type="search" list="analiseCats" placeholder="Digite um gasto: iFood, Luz, Aluguel..." aria-label="Buscar gasto" autocomplete="off" style="min-width:210px;">
            <datalist id="analiseCats"></datalist>
            <div class="seg-chips">
              <button type="button" class="chip is-active" data-filtro="fixed">Fixos</button>
              <button type="button" class="chip" data-filtro="variable">Não fixos</button>
            </div>
            <span class="planner-badge red">Média: <strong data-cat-media style="margin-left:6px;">R$ 0,00</strong></span>
          </div>
        </div>
        <div class="canvas-wrap">
          <canvas id="categoriaChart" aria-label="Gráfico do gasto da categoria por mês"></canvas>
        </div>
      </section>
    </main>
  </div>

  <script src="../js/utils.js?v=20b975831e"></script>
  <script src="../js/charts.js?v=20b975831e"></script>
  <script src="../js/app.js?v=20b975831e"></script>
  <script src="../js/analises.js?v=20b975831e"></script>
  <script src="/nexus/nexus-auth.js?v=20b975831e"></script>
  <script src="../js/pro-gate.js?v=20b975831e"></script>
  <script src="../js/nexus-intents.js?v=20b975831e"></script>
  <script src="../js/nexus-config.js?v=20b975831e"></script>
  <script src="../js/nexus.js?v=20b975831e"></script>
</body>
</html>
